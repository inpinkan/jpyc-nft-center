async function refreshNFT(reference,options={}){
  const nft=typeof reference==='object'&&reference?reference:resolveNftReference(reference);
  if(!nft||!nft.tokenId||!isOnChainNFT(nft))return null;
  const expectedKey=nftKey(nft);
  const chain=window.ethereum?await getActiveChainId():'',deployment=getDeploymentByNftContract(nft.contractAddress);
  if(!deployment||normalizeChainId(chain)!==normalizeChainId(JNC_CHAIN_REGISTRY[deployment.chainKey]?.chainId))return nft;

  try{await ensurePaymentTokenDecimals(nft);}catch(e){console.warn('Localized payment token decimals refresh failed:',e);}
  const owner=await readOwnerOf(nft.tokenId,nft.contractAddress);
  if(owner)nft.owner=owner;

  try{
    const origin=await readMarketplaceOriginState(nft.contractAddress,nft.tokenId);
    nft.originRegistered=!!origin.originRegistered;
    if(origin.creator&&lc(origin.creator)!=='0x0000000000000000000000000000000000000000')nft.creator=origin.creator;
    nft.primarySaleCompleted=!!origin.primarySaleCompleted;
  }catch(e){
    console.warn('Localized origin refresh failed:',e);
  }

  const marketplaceState=await readMarketplaceStateForNFT(nft.contractAddress,nft.tokenId);
  applyMarketplaceStateToNFT(PNC_STATE,nft,marketplaceState);

  PNC_STATE.market.offers=PNC_STATE.market.offers.filter(x=>x.nftId!==nft.id);
  try{
    nft.offers=nft.originRegistered?await readOffersForNFT(nft.contractAddress,nft.tokenId):[];
    nft.offers=nft.offers.map(offer=>({...offer,amountEth:baseUnitsToTokenAmount(offer.amountWei,nft)}));
    PNC_STATE.market.offers.push(...nft.offers.map(offer=>({...offer,nftId:nft.id})));
  }catch(e){
    console.warn('Localized offer refresh failed:',e);
  }

  PNC_STATE.market.auctions=PNC_STATE.market.auctions.filter(x=>x.nftId!==nft.id);
  try{
    nft.auction=await readAuctionForNFT(nft.contractAddress,nft.tokenId);
    if(nft.auction){
      nft.auction={...nft.auction,reservePriceEth:baseUnitsToTokenAmount(nft.auction.reservePriceWei,nft),buyNowPriceEth:baseUnitsToTokenAmount(nft.auction.buyNowPriceWei,nft),highestBidEth:baseUnitsToTokenAmount(nft.auction.highestBidWei,nft)};
      nft.status='auction';
      PNC_STATE.market.auctions.push({...nft.auction,nftId:nft.id});
    }
  }catch(e){
    console.warn('Localized auction refresh failed:',e);
  }
  if(PNC_STATE.wallet){
    try{nft.bidRefundWei=await readPendingBidRefund(PNC_STATE.wallet,nft);}catch(e){console.warn('Localized bid refund refresh failed:',e);}
  }

  const current=PNC_STATE.nfts.find(x=>nftKey(x)===expectedKey)||nft;
  renderNFTSurfaces(current);
  if(options.closeDetail)closeNftDetail();
  return current;
}
function clearForeignCreatorDrafts(wallet){

  const active=lc(wallet);
  if(!active){creator.shopDraft=null;creator.nftDraft=null;return;}
  if(creator.shopDraft&&lc(creator.shopDraft.creator)!==active)creator.shopDraft=null;
  if(creator.nftDraft&&lc(creator.nftDraft.creator)!==active)creator.nftDraft=null;
}
function applyWalletIdentity(wallet){

  PNC_STATE.wallet=wallet||null;
  if(previous!==next)clearForeignCreatorDrafts(wallet);
}

async function copyUtilityValue(value,label=''){
  const text=String(value??'').trim();
  if(!text||text==='-'){showToast(utilityLabel('unavailable'),'error');return false;}
  try{
    if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);}
    else{
      const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();
      if(!document.execCommand('copy'))throw new Error('copy command failed');area.remove();
    }
    showToast(`${label?label+' ':''}${utilityLabel('copied')}`,'success');return true;
  }catch(error){console.error('Copy failed:',error);showToast(utilityLabel('copyFailed'),'error');return false;}
}

function formatBytes(bytes){
  const value=Number(bytes||0);
  if(value<1024)return value+' B';
  if(value<1024*1024)return (value/1024).toFixed(1)+' KB';
  return (value/(1024*1024)).toFixed(2)+' MB';
}
async function loadImageForOptimization(file){
  if(!file)throw new Error(t('mediaError.imageMissing'));
  if('createImageBitmap' in window){
    try{return await createImageBitmap(file,{imageOrientation:'from-image'});}catch(e){}
  }
  return await new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{URL.revokeObjectURL(url);resolve(img);};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error(t('mediaError.imageDecodeFailed')));};
    img.src=url;
  });
}
async function optimizeImageFile(file,{maxSide=1600,quality=.86,label='display'}={}){
  const source=await loadImageForOptimization(file);
  const sourceWidth=source.width||source.naturalWidth;
  const sourceHeight=source.height||source.naturalHeight;
  if(!sourceWidth||!sourceHeight)throw new Error(t('mediaError.imageDimensions'));
  const scale=Math.min(1,maxSide/Math.max(sourceWidth,sourceHeight));
  const width=Math.max(1,Math.round(sourceWidth*scale));
  const height=Math.max(1,Math.round(sourceHeight*scale));
  const canvas=document.createElement('canvas');
  canvas.width=width;
  canvas.height=height;

async function handleCreateAuction(id){
  if(!requireWallet())return;
  const n=resolveNftReference(id);
  if(!n||!n.tokenId)return;
  try{assertMarketplacePaymentProfile(n);}catch(e){alert(e.message||e);return;}
  if(n.auction&&n.auction.active){alert(t('marketTx.activeAuctionExists'));return;}
  if(lc(n.owner)!==lc(PNC_STATE.wallet)){alert(t('marketTx.ownerOnlyAuction'));return;}
  if(Array.isArray(n.offers)&&n.offers.length){alert(t('marketTx.cancelOffersBeforeAuction'));return;}

  let minimum='0';try{minimum=await auctionMinimumEth(n);}catch(e){alert(e.message||e);return;}
  const reserve=prompt(t('marketTx.reservePrompt',{currency:currencyUnit(n),minimum}),minimum||'0.001');
  if(reserve===null)return;

  const buyNowInput=prompt(t('marketTx.buyNowPrompt',{currency:currencyUnit(n)}),'');
  if(buyNowInput===null)return;

  const defaultStart=formatAuctionInputDate(new Date(Date.now()+10*60*1000));
  const startInput=prompt(t('marketTx.auctionStartPrompt'),defaultStart);
  if(startInput===null)return;

  const daysInput=prompt(t('marketTx.auctionDaysPrompt'),'3');
  if(daysInput===null)return;

  let reserveWei,buyNowWei='0',startAt,durationDays,endsAt;
  let transactionConfirmed=false;
  try{
    reserveWei=tokenAmountToBaseUnits(reserve,n);
    if(String(buyNowInput).trim()!==''){
      buyNowWei=tokenAmountToBaseUnits(buyNowInput,n);
      const minimumBase=BigInt(await readMinimumNativeWei(n));if(BigInt(buyNowWei)<minimumBase)throw new Error(t('marketTx.buyNowBelowMinimum'));
      if(BigInt(buyNowWei)<=BigInt(reserveWei))throw new Error(t('marketTx.buyNowMustExceedReserve'));
    }
    startAt=parseAuctionStart(startInput);
    const now=Math.floor(Date.now()/1000);
    if(startAt<now+60)throw new Error(t('marketTx.auctionStartTooSoon'));
    durationDays=Number(daysInput);
    if(!Number.isInteger(durationDays)||durationDays<1||durationDays>30)throw new Error(t('marketTx.auctionDurationDays'));
    endsAt=startAt+durationDays*86400;
  }catch(e){alert(e.message||e);return;}

  const buyNowLabel=BigInt(buyNowWei)>0n?buyNowInput+' '+currencyUnit(n):'Not set';
  if(!confirm(t('marketTx.auctionConfirm',{reserve,currency:currencyUnit(n),buyNow:buyNowLabel,starts:formatAuctionTime(startAt),days:durationDays,ends:formatAuctionTime(endsAt)})))return;

  try{
    await ensureMarketplaceApproval(n);
    const txHash=(await executeMarketplaceTransaction({
      action:'createAuction',
      from:PNC_STATE.wallet,
      nft:n,
      data:encodeCreateAuctionCall(n.contractAddress,n.tokenId,reserveWei,buyNowWei,startAt,durationDays,resolveMarketplacePaymentRoute(n).tokenAddress),
      amount:reserveWei,
      label:'Create auction'
    })).txHash;
    assertSuccessfulReceipt(await waitForReceipt(txHash),'Create auction transaction');
    transactionConfirmed=true;

    // The transaction result and the later read-back result are separate facts.
    // Once the success receipt is confirmed, a delayed public/read sync must not
    // downgrade the transaction to "failed" or invite a duplicate submission.
    let refreshed=null;
    let syncError=null;
    for(let attempt=0;attempt<5;attempt++){
      try{
        refreshed=await refreshNFT(n);
        if(refreshed&&refreshed.auction&&refreshed.auction.active)break;
      }catch(error){syncError=error;}
      if(attempt<4)await sleep(1200);
    }
    if(refreshed&&refreshed.auction&&refreshed.auction.active){
      console.info('[JNC Auction] Create transaction confirmed and auction state synchronized.',txHash);
      alert(t('marketTx.auctionCreated'));
      return;
    }
    const pendingError=syncError||new Error(t('marketTx.auctionCreateVerifyFailed'));
    console.warn('[JNC Auction] Create transaction confirmed; auction state synchronization is pending.',pendingError);
    alert(transactionOutcomeMessage(pendingError,true));
  }catch(e){
    console.warn(e);
    reportTransactionOutcome(e,transactionConfirmed,'handleCreateAuction');
  }
}
/* =========================================================
   JNC v2.3.11-2 — BID RECOVERY
   ---------------------------------------------------------
   BID no longer trusts the cached auction ID, highest bid, reserve price,
   seller, phase or minimum increment. The active auction and the deployed
   Marketplace minimum are read again immediately before prompting and again
   before payment submission. The confirmed amount then uses the same single
   ERC20 approval/payment route as BUY. No legacy BID payment fallback remains.
   ========================================================= */
async function prepareActiveAuctionBid(nft,bidder){
  if(!nft||!isOnChainNFT(nft))throw new Error(t('marketTx.notActiveAuction'));
  const auction=await readAuthoritativeAuctionForAction(nft);
  const now=Math.floor(Date.now()/1000);
  if(now<auction.startAt)throw new Error(t('marketTx.notActiveAuction'));
  if(now>=auction.endsAt)throw new Error(t('marketTx.auctionEndedFinalize'));
  if(lc(auction.seller)===lc(bidder))throw new Error(t('marketTx.sellerCannotBid'));
  const increment=BigInt(auction.minimumBidIncrementWei||'0');
  if(increment<=0n)throw new Error(t('marketTx.minimumPrice'));
  const highest=BigInt(auction.highestBidWei||'0');
  const reserve=BigInt(auction.reservePriceWei||'0');
  const minimumBid=highest===0n?reserve:highest+increment;
  if(minimumBid<=0n)throw new Error(t('marketTx.minimumPrice'));
  return Object.freeze({auction,minimumBid,increment});
}
async function handleBidAuction(id){
  if(!requireWallet())return;
  const n=resolveNftReference(id);
  if(!n)return;
  try{assertMarketplacePaymentProfile(n);}catch(e){alert(e.message||e);return;}
  const walletAtSubmit=PNC_STATE.wallet;
  const nftKeyAtSubmit=nftKey(n);
  let transactionConfirmed=false;
  try{
    await ensurePaymentTokenDecimals(n,{switchChain:true});
    const prepared=await prepareActiveAuctionBid(n,walletAtSubmit);
    const minimumDisplay=baseUnitsToTokenAmount(prepared.minimumBid.toString(),n,Math.max(6,paymentTokenDecimals(n)));
    const amount=prompt(t('marketTx.bidPrompt',{minimum:minimumDisplay,currency:currencyUnit(n)}),minimumDisplay);
    if(amount===null)return;
    let amountWei;
    try{
      amountWei=tokenAmountToBaseUnits(amount,n);
      if(BigInt(amountWei)<prepared.minimumBid)throw new Error(t('marketTx.bidBelowMinimum'));
    }catch(error){alert(error.message||error);return;}
    if(!confirm(t('marketTx.bidConfirm',{amount,currency:currencyUnit(n)})))return;

    const current=await prepareActiveAuctionBid(n,walletAtSubmit);
    if(String(current.auction.auctionId)!==String(prepared.auction.auctionId))throw new Error(t('marketTx.notActiveAuction'));
    if(BigInt(amountWei)<current.minimumBid)throw new Error(t('marketTx.bidBelowMinimum'));

    const result=await executeMarketplaceTransaction({
      action:'bid',
      from:walletAtSubmit,
      nft:n,
      data:encodeBidCall(current.auction.auctionId,amountWei),
      amount:amountWei,
      label:'Bid'
    });
    const receipt=await waitForReceipt(result.txHash);
    assertSuccessfulReceipt(receipt,'Bid transaction');transactionConfirmed=true;

    const confirmed=await readMarketplaceAuction(current.auction.auctionId,n.contractAddress);
    if(!confirmed.active||lc(confirmed.highestBidder)!==lc(walletAtSubmit)||BigInt(confirmed.highestBidWei||'0')!==BigInt(amountWei)){
      throw new Error(t('marketTx.bidVerifyFailed'));

async function readAuthoritativeAuctionForAction(nft){
  if(!nft||!nft.tokenId||!isValidEvmAddress(nft.contractAddress))throw new Error(t('marketTx.notActiveAuction'));
  await switchToConfiguredChain(resolveMarketplacePaymentRoute(nft).chain);
  const auctionId=await readAuctionIdByNFT(nft.contractAddress,nft.tokenId);
  if(auctionId==='0')throw new Error(t('marketTx.notActiveAuction'));
  const auction=await readMarketplaceAuction(auctionId,nft.contractAddress);
  if(
    !auction.active||
    lc(auction.nftContract)!==lc(nft.contractAddress)||
    String(auction.tokenId)!==String(nft.tokenId)
  )throw new Error(t('marketTx.notActiveAuction'));
  return auction;
}
async function assertAuctionEscrowCustody(nft,auction){
  const deployment=getDeploymentByNftContract(nft.contractAddress);if(!deployment)throw new Error('No JNC deployment is registered for this NFT.');
  const marketplace=lc(deployment.contracts.marketplace);
  const owner=lc(await readOwnerOf(nft.tokenId,nft.contractAddress));
  if(owner!==marketplace){
    const error=new Error('Auction escrow verification failed. The Marketplace is not the on-chain NFT owner.');
    error.code='AUCTION_ESCROW_MISMATCH';
    error.owner=owner;
    throw error;
  }
  if(lc(auction.nftContract)!==lc(nft.contractAddress)||String(auction.tokenId)!==String(nft.tokenId)){
    throw new Error('Auction record does not match this NFT.');
  }
  return owner;
}

async function waitForBidRefundCleared(nft){

    const wei=await refreshBidRefundBalance(nft);

    if(attempt<13)await sleep(650);
  }
  return false;
}

async function handleUnlist(id){
  if(!requireWallet())return;
  const n=resolveNftReference(id);
  if(!n)return;
  try{assertMarketplacePaymentProfile(n);}catch(e){alert(e.message||e);return;}
  if(n.status!=='listed'||!n.listingId||n.listingId==='0'){alert(t('marketTx.notListed'));return;}
  if(lc(n.owner)!==lc(PNC_STATE.wallet)){alert(t('marketTx.ownerOnlyUnlist'));return;}
  if(!confirm(t('marketTx.unlistConfirm')))return;

  const walletAtSubmit=PNC_STATE.wallet;
  const nftKeyAtSubmit=nftKey(n);
  let transactionConfirmed=false;
  try{
    const txHash=(await executeMarketplaceTransaction({
      action:'unlist',
      from:walletAtSubmit,
      nft:n,
      data:encodeCancelListingCall(n.listingId),
      label:'Unlist'
    })).txHash;
    const receipt=await waitForReceipt(txHash);
    assertSuccessfulReceipt(receipt,'Unlist transaction');transactionConfirmed=true;

    const current=PNC_STATE.nfts.find(x=>nftKey(x)===nftKeyAtSubmit);
    if(current){
      applyMarketplaceStateToNFT(PNC_STATE,current,{status:'not_for_sale'});
      renderNFTSurfaces(current);
      closeNftDetail();
    }
    alert(t('marketTx.unlistComplete'));

    let confirmed=false;
    for(const delayMs of [1200,2200,3500]){
      await new Promise(resolve=>setTimeout(resolve,delayMs));
      try{
        const result=await readMarketplaceStateForNFT(n.contractAddress,n.tokenId);
        if(result.status==='not_for_sale'){
          confirmed=true;
          break;
        }
      }catch(e){
        console.warn('Unlist confirmation retry failed:',e);
      }
    }
    if(confirmed&&lc(PNC_STATE.wallet)===lc(walletAtSubmit)){
      await refreshNFT(nftKeyAtSubmit,{closeDetail:true});
    }else if(!confirmed){
      console.warn('Unlist is confirmed by its successful receipt. Marketplace readback is delayed; no second transaction is required.');
    }
  }catch(e){
    console.warn(e);
    reportTransactionOutcome(e,transactionConfirmed,'handleUnlist');
  }
}
/* =========================================================
   JNC v2.3.11-2 — BUY RECOVERY
   ---------------------------------------------------------
   BUY never trusts cached listing price or listing identity. Immediately
   before approval/payment, the active listing is read again from the
   Marketplace and validated against the selected NFT. The confirmed on-chain
   listingId and price are then passed through the single Marketplace payment
   route. No local BUY payment fallback is retained.
   ========================================================= */
async function prepareActiveBuyListing(nft){
  if(!nft||!isOnChainNFT(nft))throw new Error(t('marketTx.notListed'));
  await switchToConfiguredChain(resolveMarketplacePaymentRoute(nft).chain);
  const listingId=await readListingIdByNFT(nft.contractAddress,nft.tokenId);
  if(!listingId||listingId==='0')throw new Error(t('marketTx.notListed'));
  const listing=await readMarketplaceListing(listingId,nft.contractAddress);
  if(!listing.active)throw new Error(t('marketTx.notListed'));
  if(lc(listing.nftContract)!==lc(nft.contractAddress)||String(listing.tokenId)!==String(nft.tokenId)){
    throw new Error(t('dataError.listingMismatch'));
  }
  const route=resolveMarketplacePaymentRoute(nft);
  if(lc(listing.paymentToken)!==lc(route.tokenAddress))throw new Error(t('dataError.listingMismatch'));
  if(lc(listing.seller)===lc(PNC_STATE.wallet))throw new Error(t('marketTx.ownerCannotBuy'));
  const owner=await readOwnerOf(nft.tokenId,nft.contractAddress);
  if(lc(owner)!==lc(listing.seller))throw new Error(t('dataError.listingMismatch'));
  const amount=BigInt(listing.priceWei||'0');
  if(amount<=0n)throw new Error(t('marketTx.minimumPrice'));
  return Object.freeze({listingId:String(listing.listingId),priceWei:amount.toString(),seller:listing.seller,owner});
}
async function handleBuy(id){
  if(!requireWallet())return;
  const n=resolveNftReference(id);
  if(!n)return;
  try{assertMarketplacePaymentProfile(n);}catch(e){alert(e.message||e);return;}
  if(n.status!=='listed'||!n.listingId||n.listingId==='0'){alert(t('marketTx.notListed'));return;}
  if(lc(n.owner)===lc(PNC_STATE.wallet)){alert(t('marketTx.ownerCannotBuy'));return;}
  if(!confirm(t('marketTx.buyConfirm')))return;
  const nftKeyAtSubmit=nftKey(n);
  const walletAtSubmit=PNC_STATE.wallet;
  let transactionConfirmed=false;
  try{
    const activeListing=await prepareActiveBuyListing(n);
    const result=await executeMarketplaceTransaction({
      action:'buy',
      from:walletAtSubmit,
      nft:n,
      data:encodeBuyCall(activeListing.listingId),
      amount:activeListing.priceWei,
      label:'Buy'
    });
    const receipt=await waitForReceipt(result.txHash);
    assertSuccessfulReceipt(receipt,'Buy transaction');transactionConfirmed=true;
    const confirmedOwner=await readOwnerOfWithRetry(n.tokenId,walletAtSubmit,10,1500,n.contractAddress);
    const ownerConfirmed=lc(confirmedOwner)===lc(walletAtSubmit);
    const refreshed=await refreshNFT(nftKeyAtSubmit);
    const refreshedOwnerConfirmed=!!refreshed&&lc(refreshed.owner)===lc(walletAtSubmit);
    if(!ownerConfirmed&&!refreshedOwnerConfirmed){
      console.warn('BUY succeeded on-chain; owner information is still synchronizing.',{confirmedOwner,refreshedOwner:refreshed&&refreshed.owner});
      alert(t('marketTx.buySyncPending'));
      return;
    }
    if(refreshed&&!refreshedOwnerConfirmed){
      console.warn('BUY receipt and ownerOf succeeded, but refreshed UI state is delayed.',refreshed.owner);
    }
    alert(t('marketTx.buyComplete'));
  }catch(e){
    console.warn('BUY recovery transaction failed:',e);
    reportTransactionOutcome(e,transactionConfirmed,'handleBuy');
  }
}

function isInfiniteCarousel(track){return !!track&&track.id===PNC_AUTO_CAROUSEL_ID&&Number(track.dataset.carouselSetWidth||0)>0;}
function updateCarouselControls(track){
  const prev=document.querySelector(`[data-carousel-prev="${track.id}"]`);
  const next=document.querySelector(`[data-carousel-next="${track.id}"]`);
  const overflow=track.scrollWidth>track.clientWidth+4;
  if(prev)prev.disabled=!overflow;
  if(next)next.disabled=!overflow;
}
function cancelCarouselAnimation(track){
  if(!track)return;
  if(track._carouselAnimationFrame)cancelAnimationFrame(track._carouselAnimationFrame);
  track._carouselAnimationFrame=0;
  track.classList.remove('is-animating');
}
function clearCarouselResumeTimer(track){
  if(!track||!track._carouselResumeTimer)return;
  clearTimeout(track._carouselResumeTimer);
  track._carouselResumeTimer=0;
}
function setAutoCarouselPaused(track,paused){
  if(!track||track.id!==PNC_AUTO_CAROUSEL_ID)return;
  track.dataset.carouselPaused=paused?'1':'0';
  track.classList.toggle('is-auto-scrolling',!paused&&!document.hidden);
  if(!paused)track._carouselPosition=track.scrollLeft;
}
function pauseCarouselAuto(track){
  if(!track||track.id!==PNC_AUTO_CAROUSEL_ID)return;
  clearCarouselResumeTimer(track);
  setAutoCarouselPaused(track,true);
}
function resumeCarouselAuto(track,delay=PNC_AUTO_RESUME_DELAY_MS){
  if(!track||track.id!==PNC_AUTO_CAROUSEL_ID)return;
  clearCarouselResumeTimer(track);
  track._carouselResumeTimer=setTimeout(()=>{
    track._carouselResumeTimer=0;
    normalizeInfiniteCarousel(track);
    setAutoCarouselPaused(track,false);
    startCarouselAuto(track);
  },Math.max(0,delay));
}
function stopCarouselAuto(track){
  if(!track)return;
  clearCarouselResumeTimer(track);
  if(track._carouselAutoFrame)cancelAnimationFrame(track._carouselAutoFrame);
  track._carouselAutoFrame=0;
  track._carouselAutoLastTime=0;
  track.classList.remove('is-auto-scrolling');
}
function normalizeInfiniteCarousel(track){
  if(!isInfiniteCarousel(track))return;
  const width=Number(track.dataset.carouselSetWidth||0);
  let left=track.scrollLeft;
  if(left>=width*2)left-=width;
  else if(left<width)left+=width;
  if(Math.abs(left-track.scrollLeft)>.5)track.scrollLeft=left;
  track._carouselPosition=left;
}
function prepareInfiniteCarousel(track){
  if(!track||track.id!==PNC_AUTO_CAROUSEL_ID)return;
  stopCarouselAuto(track);
  track.querySelectorAll('[data-carousel-clone="1"]').forEach(node=>node.remove());
  delete track.dataset.carouselSetWidth;
  const originals=Array.from(track.children);
  if(originals.length<2){
    track.scrollLeft=0;
    track._carouselPosition=0;
    updateCarouselControls(track);
    return;
  }
  const originalWidth=track.scrollWidth;
  if(originalWidth<=track.clientWidth+4){
    track.scrollLeft=0;
    track._carouselPosition=0;
    updateCarouselControls(track);
    return;
  }
  const before=document.createDocumentFragment();
  const after=document.createDocumentFragment();
  originals.forEach(card=>{
    const leftClone=card.cloneNode(true);leftClone.dataset.carouselClone='1';leftClone.setAttribute('aria-hidden','true');before.appendChild(leftClone);
    const rightClone=card.cloneNode(true);rightClone.dataset.carouselClone='1';rightClone.setAttribute('aria-hidden','true');after.appendChild(rightClone);
  });
  track.prepend(before);
  track.append(after);
  requestAnimationFrame(()=>{
    const middleFirst=originals[0];
    const rightFirst=track.querySelectorAll('[data-carousel-clone="1"]')[originals.length];
    const setWidth=rightFirst&&middleFirst?rightFirst.offsetLeft-middleFirst.offsetLeft:originalWidth;
    if(setWidth<=0)return;
    track.dataset.carouselSetWidth=String(setWidth);
    track.scrollLeft=middleFirst.offsetLeft;
    track._carouselPosition=track.scrollLeft;
    track.dataset.carouselPaused='0';
    updateCarouselControls(track);
    startCarouselAuto(track);
  });
}
function startCarouselAuto(track){
  if(!track||track.id!==PNC_AUTO_CAROUSEL_ID||track._carouselAutoFrame)return;
  const frame=now=>{
    track._carouselAutoFrame=requestAnimationFrame(frame);
    if(!track._carouselAutoLastTime)track._carouselAutoLastTime=now;
    const dt=Math.min(50,now-track._carouselAutoLastTime);
    track._carouselAutoLastTime=now;
    const blocked=document.hidden||track.dataset.carouselPaused==='1'||track.classList.contains('is-dragging')||track.classList.contains('is-animating')||!isInfiniteCarousel(track);
    track.classList.toggle('is-auto-scrolling',!blocked);
    if(blocked)return;
    const width=Number(track.dataset.carouselSetWidth||0);
    let position=Number.isFinite(track._carouselPosition)?track._carouselPosition:track.scrollLeft;
    position+=PNC_AUTO_SCROLL_SPEED_PX_PER_MS*dt;
    if(position>=width*2)position-=width;
    track._carouselPosition=position;
    track.scrollLeft=Math.floor(position);
  };
  track._carouselAutoFrame=requestAnimationFrame(frame);
}
function animateCarouselTo(track,target,duration=720){
  if(!track)return;
  cancelCarouselAnimation(track);
  const max=Math.max(0,track.scrollWidth-track.clientWidth);
  const from=track.scrollLeft;
  const to=Math.max(0,Math.min(max,target));
  const distance=to-from;
  if(Math.abs(distance)<1){resumeCarouselAuto(track);return;}
  const started=performance.now();
  track.classList.add('is-animating');
  const ease=t=>1-Math.pow(1-t,3);
  const frame=now=>{
    const progress=Math.min(1,(now-started)/duration);
    track.scrollLeft=from+(distance*ease(progress));
    track._carouselPosition=track.scrollLeft;
    if(progress<1)track._carouselAnimationFrame=requestAnimationFrame(frame);
    else{
      track._carouselAnimationFrame=0;
      track.classList.remove('is-animating');
      normalizeInfiniteCarousel(track);
      resumeCarouselAuto(track);
    }
  };
  track._carouselAnimationFrame=requestAnimationFrame(frame);
}
function moveCarousel(id,direction){
  const track=$(id);if(!track)return;
  pauseCarouselAuto(track);
  animateCarouselTo(track,track.scrollLeft+(direction*carouselStep(track)),760);
}
function applyDesktopMomentum(track,velocity){
  cancelCarouselAnimation(track);
  let v=velocity,previous=performance.now();
  track.classList.add('is-animating');
  const frame=now=>{
    const dt=Math.min(32,now-previous);previous=now;
    track.scrollLeft-=v*dt;
    track._carouselPosition=track.scrollLeft;
    v*=Math.pow(.94,dt/16.67);
    if(Math.abs(v)>.02)track._carouselAnimationFrame=requestAnimationFrame(frame);
    else{
      track._carouselAnimationFrame=0;
      track.classList.remove('is-animating');
      normalizeInfiniteCarousel(track);
      resumeCarouselAuto(track);
    }
  };
  track._carouselAnimationFrame=requestAnimationFrame(frame);
}
function bindCarousel(track){
  if(track.dataset.carouselBound==='1'){
    if(track.id===PNC_AUTO_CAROUSEL_ID)prepareInfiniteCarousel(track);
    else updateCarouselControls(track);
    return;
  }
  track.dataset.carouselBound='1';
  const prev=document.querySelector(`[data-carousel-prev="${track.id}"]`);
  const next=document.querySelector(`[data-carousel-next="${track.id}"]`);
  prev?.addEventListener('click',()=>moveCarousel(track.id,-1));
  next?.addEventListener('click',()=>moveCarousel(track.id,1));
  let pointerActive=false,dragging=false,moved=false,activePointerId=null,startX=0,startY=0,startScroll=0,lastX=0,lastTime=0,velocity=0;
  track.addEventListener('pointerdown',event=>{
    pauseCarouselAuto(track);
    if(event.pointerType==='touch')return;
    cancelCarouselAnimation(track);pointerActive=true;dragging=false;moved=false;activePointerId=event.pointerId;startX=lastX=event.clientX;startY=event.clientY;startScroll=track.scrollLeft;lastTime=performance.now();velocity=0;
  });
  track.addEventListener('pointermove',event=>{
    if(!pointerActive||event.pointerId!==activePointerId)return;
    const dx=event.clientX-startX,dy=event.clientY-startY;
    if(!dragging&&Math.abs(dx)>6&&Math.abs(dx)>Math.abs(dy)){dragging=true;moved=true;track.classList.add('is-dragging');track.setPointerCapture?.(event.pointerId);}
    if(!dragging)return;
    event.preventDefault();
    const now=performance.now(),dt=Math.max(1,now-lastTime);velocity=(event.clientX-lastX)/dt;lastX=event.clientX;lastTime=now;
    track.scrollLeft=startScroll-dx;track._carouselPosition=track.scrollLeft;
  });
  const finishPointer=event=>{
    if(!pointerActive||event.pointerId!==activePointerId)return;
    pointerActive=false;activePointerId=null;track.classList.remove('is-dragging');
    if(dragging)applyDesktopMomentum(track,velocity);else resumeCarouselAuto(track);
    dragging=false;
  };
  track.addEventListener('pointerup',finishPointer);track.addEventListener('pointercancel',finishPointer);track.addEventListener('lostpointercapture',finishPointer);
  track.addEventListener('click',event=>{if(!moved)return;event.preventDefault();event.stopPropagation();moved=false;},true);
  const pauseForTouch=()=>{cancelCarouselAnimation(track);pauseCarouselAuto(track);track._carouselPosition=track.scrollLeft;};
  const resumeAfterTouch=()=>{normalizeInfiniteCarousel(track);track._carouselPosition=track.scrollLeft;resumeCarouselAuto(track);};
  track.addEventListener('touchstart',pauseForTouch,{passive:true});track.addEventListener('touchmove',pauseForTouch,{passive:true});track.addEventListener('touchend',resumeAfterTouch,{passive:true});track.addEventListener('touchcancel',resumeAfterTouch,{passive:true});
  track.addEventListener('scroll',()=>{if(track.id===PNC_AUTO_CAROUSEL_ID&&track.dataset.carouselPaused==='1')track._carouselPosition=track.scrollLeft;},{passive:true});
  track.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'){event.preventDefault();moveCarousel(track.id,-1);}if(event.key==='ArrowRight'){event.preventDefault();moveCarousel(track.id,1);}});
  if(track.id===PNC_AUTO_CAROUSEL_ID)prepareInfiniteCarousel(track);else updateCarouselControls(track);
}

async function handleVaultSend(form){
  if(!requireWallet())return;
  const fd=new FormData(form),id=String(fd.get('nftId')||''),to=String(fd.get('toAddress')||'').trim();
  const n=resolveNftReference(id,vaultSendableNFTs(PNC_STATE));
  if(!n){alert(t('vaultTx.nftUnavailable'));return;}
  if(!/^0x[a-fA-F0-9]{40}$/.test(to)){alert(t('vaultTx.invalidAddress'));return;}
  if(lc(to)===lc(PNC_STATE.wallet)){alert(t('vaultTx.sameAddress'));return;}
  if(lc(to)==='0x0000000000000000000000000000000000000000'){alert(t('vaultTx.zeroAddress'));return;}
  if(n.status==='listed'||(n.auction&&n.auction.active)){alert(t('vaultTx.removeFromMarketFirst'));return;}
  if(!confirm(t('vaultTx.sendConfirm',{name:n.name,tokenId:n.tokenId,to})))return;
  let transactionConfirmed=false;
  try{
    const deployment=getDeploymentByNftContract(n.contractAddress);if(!deployment)throw new Error('No JNC deployment is registered for this NFT.');await switchToConfiguredChain(deployment.chainKey);
    const ownerBefore=await readOwnerOf(n.tokenId,n.contractAddress);
    if(lc(ownerBefore)!==lc(PNC_STATE.wallet))throw new Error(t('marketTx.walletNoLongerOwner'));
    const txHash=await sendTx({from:PNC_STATE.wallet,to:n.contractAddress,data:encodeSafeTransferFromCall(PNC_STATE.wallet,to,n.tokenId),chainKey:deployment.chainKey});
    assertSuccessfulReceipt(await waitForReceipt(txHash),'NFT transfer transaction');transactionConfirmed=true;
    const ownerAfter=await readOwnerOfWithRetry(n.tokenId,to,8,1500,n.contractAddress);
    if(lc(ownerAfter)!==lc(to))throw new Error(t('marketTx.newOwnerVerifyFailed'));
    await refreshNFT(n);
    PNC_VAULT_TAB='owned';
    renderVault(PNC_STATE);
    alert(t('vaultTx.sendComplete',{owner:to}));
  }catch(e){
    console.warn(e);
    alert((transactionConfirmed?t('marketTx.transactionConfirmedSyncPending'):t('vaultTx.sendFailed'))+'\n'+(e.message||e));
  }
}

function footerAccordionHtml(group){
  return`<details class="footer-accordion"><summary>${esc(group.titleKey?t(group.titleKey):group.title)}</summary><div class="footer-accordion-content">${group.items.map(footerItemHtml).join('')}</div></details>`;
}
function renderFooter(){
  const marketplace=PNC_FOOTER.marketplace;
  const community=PNC_FOOTER.community;
  const accordions=[PNC_FOOTER.help,PNC_FOOTER.about,PNC_FOOTER.legal];
  $('appFooter').innerHTML=`<div class="footer-grid"><div class="footer-column footer-marketplace"><div class="footer-title">${esc(marketplace.titleKey?t(marketplace.titleKey):marketplace.title)}</div><div class="footer-items">${marketplace.items.map(footerItemHtml).join('')}</div></div><div class="footer-column footer-guides"><div class="footer-accordion-stack">${accordions.map(footerAccordionHtml).join('')}</div></div><div class="footer-column footer-community"><div class="footer-title">${esc(community.titleKey?t(community.titleKey):community.title)}</div><div class="footer-items">${community.items.map(footerItemHtml).join('')}</div></div></div><div class="footer-bottom"><span>© 2026 JPYC NFT Center</span><span><span class="network-dot"></span> ${esc(t('footer.network'))}</span></div>`;
}
function legalSectionHtml(section){return`<section class="legal-section"><h3>${esc(section.heading)}</h3><p>${esc(section.body)}</p></section>`;}
function showFooterPage(type){
  const page=footerPageContent(type);
  if(!page)return;
  const legalBox=$('legalBox');
  legalBox.dataset.footerPage=type;
  legalBox.innerHTML=`<div class="legal-toolbar"><div><h2 class="legal-heading" id="legalTitle">${esc(page.title)}</h2><div class="legal-updated">${esc(t('footer.lastUpdated',{date:page.updated}))}</div></div><button class="legal-close" type="button" aria-label="${esc(t('common.close'))}" onclick="closeLegal()">×</button></div>${page.sections.map(legalSectionHtml).join('')}<div class="legal-notice">${esc(t('footer.notice'))}</div>`;
  const modal=$('legalModal');
  prepareModalOpen(modal);
  modal.classList.add('show');
  document.body.style.overflow='hidden';
}
function closeLegal(event){
  if(event&&event.target&&event.target.id!=='legalModal')return;
  closeModalElement($('legalModal'),()=>{document.body.style.overflow='';});
}
function clearSearchUI(){const input=$('searchInput'),box=$('searchResults');if(input){input.value='';input.blur();}if(box){box.classList.remove('show');box.innerHTML='';}}function selectSearchCollection(collectionId){clearSearchUI();openCollection(collectionId);}function selectSearchNFT(id){clearSearchUI();showDetailById(id);}function openCollection(collectionId){renderCollectionPage(PNC_STATE,collectionId);showPage('collectionPage');}function showDetailById(id){const n=resolveNftReference(id);if(!n)return;const detailBox=$('nftDetailBox');detailBox.dataset.nftRef=nftReference(n);const c=PNC_STATE.collections.find(x=>x.id===n.collectionId)||{};const desc=n.description||(n.metadata&&n.metadata.description)||'';$('nftDetailBox').innerHTML=`<div class="detail-toolbar"><button class="detail-close" onclick="closeNftDetail()">×</button></div><div class="detail-head">${renderNFTMedia(n,'detail')}<div class="detail-summary"><div class="detail-title">${esc(n.name)}</div><div class="meta">${esc(c.name||n.collectionName||'-')} ${c.verified?'<span class="badge">✔</span>':''}</div>${priceLine(n)}${shopSocialHtml(c)}<div class="badge-row"><span class="badge ${statusClass(n)}">${esc(statusLabel(n))}</span>${chainBadgeHtml(n)}${paymentTokenBadgeHtml(n,true)}</div></div></div>${desc?`<div class="detail-section"><div class="detail-section-title">${esc(t('detail.description'))}</div><div class="meta">${esc(desc)}</div></div>`:''}<div class="detail-section"><div class="detail-section-title">${esc(t('detail.information'))}</div><div class="detail-info-grid"><div>${utilityPlainInfoRow(t('detail.nftId'),displayNFTId(n),t('detail.nftId'))}${infoRow(t('common.chain'),getNFTPaymentProfile(n).chain.name)}${infoRow('Payment Token',getNFTPaymentProfile(n).paymentToken.symbol||getNFTPaymentProfile(n).paymentToken.displaySymbol)}${infoRow(t('detail.mediaType'),resolveNFTMedia(n).mediaType==='video'?t('detail.videoNft'):t('detail.imageNft'))}${utilityPlainInfoRow(t('common.tokenId'),n.tokenId||'-',t('common.tokenId'))}${infoRow(t('detail.collection'),c.name||n.collectionName||'-')}${utilityInfoRow(t('common.contract'),n.contractAddress,t('common.contract'))}</div><div>${utilityStaticAddressRow(t('common.owner'),n.owner)}${utilityStaticAddressRow(t('common.creator'),n.creator)}${infoRow(t('detail.primarySale'),n.primarySaleCompleted?t('detail.completed'):t('detail.notCompleted'))}${n.utility?infoRow(t('creator.utility'),n.utility):''}${infoRow(t('detail.seller'),displayAddress(n.seller))}${infoRow(t('detail.listingId'),n.listingId||'-')}${infoRow(t('detail.activeOffers'),(n.offers||[]).length)}${n.auction?infoRow(t('marketUi.auctionId'),n.auction.auctionId):''}${n.auction?infoRow(t('detail.auctionSeller'),displayAddress(n.auction.seller)):''}</div></div></div>${nftUtilityPanelHtml(n)}<div class="detail-section"><div class="detail-section-title">${esc(t('common.offers'))}</div>${offerListHtml(n)}</div><div class="detail-section"><div class="detail-section-title">${esc(t('common.auction'))}</div>${auctionListHtml(n)}</div>${bidRefundHtml(n)}${detailActionButtons(n)}`;const modal=$('nftDetailOverlay');prepareModalOpen(modal);modal.classList.add('show');}function closeNftDetail(ev){if(ev&&ev.target&&ev.target.id!=='nftDetailOverlay')return;closeModalElement($('nftDetailOverlay'));}function searchPNC(){const q=lc($('searchInput').value).trim(),box=$('searchResults');if(!q){box.classList.remove('show');box.innerHTML='';return;}const cs=PNC_STATE.collections.filter(c=>lc(c.name).includes(q));const ns=PNC_STATE.nfts.filter(n=>lc(n.name).includes(q));box.innerHTML=cs.map(c=>`<div class="search-item" onclick="selectSearchCollection('${esc(c.id)}')">🏪 ${esc(c.name)}<div class="meta">${esc(t('search.collection'))}</div></div>`).join('')+ns.map(n=>`<div class="search-item" onclick="selectSearchNFT('${esc(nftReference(n))}')">🖼 ${esc(n.name)}<div class="meta">NFT</div></div>`).join('');box.classList.toggle('show',!!box.innerHTML);}
document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeLegal();closeNftDetail();closeWalletModal();}});
document.addEventListener('DOMContentLoaded',async()=>{
  try{
    initLanguageEngine();
    applyJPYCBrandIcon();
    installCreatorWorkCapture();
    installWalletListeners();
    const recovered=await recoverAuthorizedWallet({render:false,refreshOnChange:false});
    if(recovered&&PNC_STATE.wallet)prepareCreatorWorkRecovery(PNC_STATE.wallet);
    console.info('[JNC Payment Audit]',JNC_PAYMENT_AUDIT_REPORT);
    await refreshPlatform();
    if(PNC_STATE.wallet)restoreCreatorWorkUIStable(PNC_STATE.wallet);
  }catch(e){
    setRefreshButtonState('error');
  }
});
</script>
</body>
</html>
