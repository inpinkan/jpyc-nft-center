/* =========================================================
   JNC v1.9.5 — NETWORK & TRANSACTION SAFETY
   ---------------------------------------------------------
   Purpose:
   - Keep Safe UI and Transaction UI strings on one t() lookup path.
   - Preserve the approved UI, wallet, storage, media and marketplace feature paths.
   - Migrate transaction prompts, confirmations, progress, success and failure messages through t().

   Active boundaries:
   - PNC_I18N / t() own safe and transaction interface labels.
   - User NFT / Shop metadata is never translated or rewritten.
   - Blockchain, Marketplace, Pinata, KV and transaction logic remains unchanged.
   ========================================================= */

/* =========================================================
   JNC v1.8.5 — THEME FOUNDATION & MOBILE MENU SCROLL
   Visual rules only. Marketplace / wallet logic is unchanged.
   ========================================================= */
:root{
  --pnc-space-1:4px;
  --pnc-space-2:8px;
  --pnc-space-3:12px;
  --pnc-space-4:16px;
  --pnc-space-5:24px;
  --pnc-radius-sm:12px;
  --pnc-radius-md:16px;
  --pnc-radius-lg:20px;
  --pnc-control-h:42px;
  --pnc-shadow-card:0 8px 24px rgba(0,0,0,.16);
  --pnc-shadow-float:0 12px 32px rgba(0,0,0,.28);
  --pnc-focus:0 0 0 3px rgba(97,183,232,.24);
  --pnc-transition:160ms ease;
}

/* Typography and rhythm */
body{line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
main{padding-top:20px}
.section{margin:24px 0}
.section-title{line-height:1.2;letter-spacing:-.015em}
.name,.nft-name,.collection-name{line-height:1.28}
.meta{line-height:1.5}

/* Unified surfaces */
.panel,.card,.collection-list,.stat,.status-box,.creator-list-item,.draft-card,.note{
  box-shadow:var(--pnc-shadow-card);
}
.panel,.card,.collection-list{border-radius:var(--pnc-radius-lg)}
.card{overflow:hidden;transition:transform var(--pnc-transition),border-color var(--pnc-transition),box-shadow var(--pnc-transition)}
@media (hover:hover){
  .card:hover{transform:translateY(-2px);border-color:rgba(97,183,232,.46);box-shadow:0 12px 28px rgba(0,0,0,.23)}
}

/* Unified controls */
.wallet-btn,.primary-btn,.small-btn,.creator-tab,.ghost-btn,.sell-btn,.buy-btn,.delete-btn,
.refresh-btn,.menu-btn,.carousel-btn{
  min-height:var(--pnc-control-h);
  transition:transform var(--pnc-transition),filter var(--pnc-transition),background var(--pnc-transition),border-color var(--pnc-transition),box-shadow var(--pnc-transition);
}
.wallet-btn,.primary-btn,.small-btn{border-radius:var(--pnc-radius-sm)}
button:active{transform:translateY(1px)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{
  outline:none;box-shadow:var(--pnc-focus)
}
@media (hover:hover){
  .wallet-btn:hover,.primary-btn:hover,.sell-btn:hover,.buy-btn:hover{filter:brightness(1.06)}
  .ghost-btn:hover,.small-btn:hover,.creator-tab:hover{border-color:rgba(97,183,232,.5)}
}

/* Forms */
.search-row input,.form input,.form textarea,.form select{
  min-height:var(--pnc-control-h);
  border:1px solid transparent;
  transition:border-color var(--pnc-transition),box-shadow var(--pnc-transition);
}
.search-row input:focus,.form input:focus,.form textarea:focus,.form select:focus{
  border-color:rgba(97,183,232,.75);
  box-shadow:var(--pnc-focus)
}
.form label{gap:7px}

/* Cards and media */
.nft-img,.collection-banner,.top-banner,.detail-image,.nft-media-card{overflow:hidden}
.body{padding:13px}
.badge-row{gap:6px;margin-top:8px}
.badge,.status-badge,.chain-badge{padding:4px 9px}
.price-block{margin:9px 0}

/* Modals, menus, toast-like floating layers */
.menu,.search-results{box-shadow:var(--pnc-shadow-float)}
.menu button{transition:background var(--pnc-transition),border-color var(--pnc-transition)}
@media (hover:hover){.menu button:hover{background:rgba(97,183,232,.12);border-color:rgba(97,183,232,.6)}}

/* Carousel controls stay visually consistent */
.carousel-btn{display:inline-flex;align-items:center;justify-content:center}
.carousel-btn:focus-visible{box-shadow:var(--pnc-focus)}

/* Preserve the approved compact footer; only refine alignment */
.site-footer{flex-shrink:0}
.footer-main{align-items:start}
.footer-column h3,.footer-accordion summary{line-height:1.25}
.footer-link{line-height:1.35}
.footer-bottom{line-height:1.35}

/* Mobile polish without enlarging the approved footer */
@media (max-width:640px){
  main{padding:16px 12px 34px}
  .section{margin:22px 0}
  .section-title{font-size:22px}
  .grid{gap:10px}

  .body{padding:11px}
  .nft-media-card,.nft-img{height:136px}
  .wallet-btn,.primary-btn,.small-btn,.creator-tab,.ghost-btn,.sell-btn,.buy-btn,.delete-btn{min-height:40px}

/* Device-specific interaction: keep PC hover, add restrained touch feedback. */
.pnc-interactive-card{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (hover:none) and (pointer:coarse){
  .pnc-interactive-card{
    transition:transform 80ms ease,filter 80ms ease,border-color 80ms ease,box-shadow 80ms ease;
  }
  .pnc-interactive-card:active{
    transform:scale(.98);
    filter:brightness(.96);
    border-color:rgba(97,183,232,.48);
  }
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}


/* =========================================================
   JNC v1.8.5 — COMPONENT POLISH + FEEDBACK MOTION
   NFT/Shop cards, modals, toast, loading and empty states.
   ========================================================= */
:root{
  --pnc-card-border:rgba(49,136,213,.34);
  --pnc-card-border-hover:rgba(97,183,232,.58);
  --pnc-card-bg:linear-gradient(180deg,rgba(16,38,61,.98),rgba(7,22,37,.98));
  --pnc-layer-bg:rgba(10,31,51,.98);
  --pnc-muted-bg:rgba(255,255,255,.035);
}
.nft-card,.collection-card,.top-collection,.creator-list-item{
  border-color:var(--pnc-card-border);
  background:var(--pnc-card-bg);
}
@media (hover:hover){
  .nft-card:hover,.collection-card:hover,.top-collection:hover{
    border-color:var(--pnc-card-border-hover);
    transform:translateY(-2px);
  }
}
.nft-card .body,.collection-card .body{display:flex;flex-direction:column;gap:5px}

.nft-card .meta,.collection-card .meta{line-height:1.45}

.detail-box,.wallet-box,.legal-box{
  background:var(--pnc-layer-bg);
  border:1px solid rgba(97,183,232,.34);
  box-shadow:0 24px 70px rgba(0,0,0,.58);
}

.detail-overlay,.wallet-modal,.legal-modal{
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
}
.detail-overlay.show,.wallet-modal.show,.legal-modal.show{
  animation:pncOverlayIn 180ms ease-out both;
}
.detail-overlay.show .detail-box,.wallet-modal.show .wallet-box,.legal-modal.show .legal-box{
  animation:pncModalIn 190ms cubic-bezier(.22,.8,.32,1) both;
  transform-origin:center bottom;
}
@keyframes pncOverlayIn{from{opacity:0}to{opacity:1}}
@keyframes pncModalIn{
  from{opacity:0;transform:translateY(14px) scale(.992)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.detail-overlay.closing,.wallet-modal.closing,.legal-modal.closing{
  animation:pncOverlayOut 145ms ease-in both;
  pointer-events:none;
}
.detail-overlay.closing .detail-box,.wallet-modal.closing .wallet-box,.legal-modal.closing .legal-box{
  animation:pncModalOut 145ms cubic-bezier(.4,0,1,1) both;
  transform-origin:center bottom;
}
@keyframes pncOverlayOut{from{opacity:1}to{opacity:0}}
@keyframes pncModalOut{
  from{opacity:1;transform:translateY(0) scale(1)}
  to{opacity:0;transform:translateY(8px) scale(.996)}
}
.detail-box h2,.wallet-box h2,.legal-box h2{margin-top:0;line-height:1.25}
.close-btn{min-height:42px}

.pnc-toast-region{position:fixed;right:18px;bottom:18px;z-index:10000;display:grid;gap:10px;pointer-events:none}

.pnc-toast.success{border-color:rgba(84,208,143,.65)}
.pnc-toast.error{border-color:rgba(255,102,119,.7)}
@keyframes pncToastIn{to{opacity:1;transform:translateY(0)}}

/* JNC v1.9.5 — Language UX */
.language-panel{display:grid;gap:8px}
.language-current-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 11px;border:1px solid rgba(97,183,232,.28);border-radius:12px;background:rgba(97,183,232,.06)}
.language-current-summary span{font-size:12px;color:var(--muted)}
.language-current-summary strong{font-size:13px;color:var(--text)}
.language-list{display:grid;gap:6px}
.menu .language-option{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0;padding:10px 11px;border:1px solid transparent;border-radius:12px}
.language-option-main{display:flex;align-items:center;gap:9px;min-width:0}
.language-option-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.language-option-status{flex:0 0 auto;padding:3px 7px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.02em}
.language-option.is-current{border-color:rgba(84,208,143,.48);background:rgba(84,208,143,.08)}
.language-option.is-current .language-option-status{color:#bdf5d6;background:rgba(84,208,143,.16)}
body.light .language-option.is-current .language-option-status{color:#1d6b45}
.language-option.is-preparing,.language-option:disabled{cursor:not-allowed;opacity:.62}
.language-option.is-preparing .language-option-status{color:var(--muted);background:var(--pnc-muted-bg)}
.language-option:disabled:hover{transform:none;background:transparent;border-color:transparent}

.pnc-loading{display:flex;align-items:center;justify-content:center;gap:10px;min-height:92px;padding:18px;border:1px solid var(--pnc-card-border);border-radius:16px;background:var(--pnc-muted-bg);color:var(--muted)}
.pnc-spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;animation:pncSpin .75s linear infinite}
@keyframes pncSpin{to{transform:rotate(360deg)}}

.empty-state{display:flex;align-items:center;gap:12px;width:100%;min-height:76px;padding:16px 18px;border:1px dashed rgba(49,136,213,.48);border-radius:16px;background:rgba(49,136,213,.055);color:var(--muted)}
.empty-state-icon{flex:0 0 auto;font-size:24px;line-height:1}
.empty-state-copy{display:grid;gap:2px}
.empty-state-copy strong{color:var(--text);font-size:14px}
.empty-state-copy span{font-size:13px;line-height:1.4}

.edit-shop-selector{padding:12px;border:1px solid rgba(97,183,232,.3);border-radius:14px;background:rgba(97,183,232,.055)}
.edit-shop-selector select{margin-top:6px}
.edit-shop-summary{display:flex;gap:10px;align-items:center;padding:10px 0 2px;color:var(--muted);font-size:12px}

@media (max-width:640px){
  .pnc-toast-region{left:12px;right:12px;bottom:12px}
  .pnc-toast{min-width:0;max-width:none;width:100%}
  .empty-state{min-height:68px;padding:13px 14px}
}


/* Phase 2: calm feedback motion for menu, toast and loading. */
.menu{
  display:block!important;max-height:0;opacity:0;overflow:hidden;visibility:hidden;
  margin-top:0!important;padding:0 10px!important;border-width:0!important;
  transform:translateY(-6px);transform-origin:top;
  transition:max-height 220ms cubic-bezier(.22,.8,.32,1),opacity 150ms ease,transform 180ms ease,margin-top 180ms ease,padding 180ms ease,border-width 0ms linear 180ms,visibility 0ms linear 220ms;
}
.menu.show{
  max-height:720px;opacity:1;visibility:visible;margin-top:10px!important;padding:10px!important;
  border-width:1px!important;transform:translateY(0);
  transition:max-height 240ms cubic-bezier(.22,.8,.32,1),opacity 170ms ease,transform 190ms ease,margin-top 180ms ease,padding 180ms ease,border-width 0ms,visibility 0ms;
}
.menu-inner{display:block}
.menu-btn[aria-expanded="true"]{background:rgba(97,183,232,.12);box-shadow:var(--pnc-focus)}
.language-list{display:grid;gap:6px}
.menu .language-option{display:flex;align-items:center;justify-content:space-between;gap:12px}
.menu .language-option span{font-size:11px;color:var(--muted);font-weight:700}
.menu .language-option.is-active{border-color:rgba(84,208,143,.55);background:rgba(84,208,143,.08)}

.pnc-toast{animation:none;transition:opacity 145ms ease,transform 165ms cubic-bezier(.22,.8,.32,1)}
.pnc-toast.is-visible{opacity:1;transform:translateY(0)}
.pnc-toast.is-leaving{opacity:0;transform:translateY(6px);transition-duration:125ms;transition-timing-function:ease-in}
.pnc-loading{position:relative;overflow:hidden;animation:pncLoadingIn 170ms ease-out both}
.pnc-loading::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.045) 48%,transparent 76%);transform:translateX(-110%);animation:pncLoadingSweep 1.55s ease-in-out infinite;pointer-events:none}
.pnc-loading>span{position:relative;z-index:1}
@keyframes pncLoadingIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes pncLoadingSweep{0%,20%{transform:translateX(-110%)}75%,100%{transform:translateX(110%)}}
@media (prefers-reduced-motion:reduce){.menu,.menu.show,.pnc-toast,.pnc-loading{transition:none!important;animation:none!important}.pnc-loading::after{display:none}}


/* =========================================================
   JNC v1.8.5 — LIGHT THEME FOUNDATION / MOBILE MENU SCROLL
   One theme path, one menu path. Dark behavior is preserved.
   ========================================================= */
body.light{
  color-scheme:light;
  background-image:
    linear-gradient(45deg,rgba(23,79,155,.035) 25%,transparent 25%,transparent 75%,rgba(23,79,155,.035) 75%),
    linear-gradient(45deg,rgba(23,79,155,.035) 25%,transparent 25%,transparent 75%,rgba(23,79,155,.035) 75%);
  --bg:#f4f8fc;
  --card:#ffffff;
  --text:#102a43;
  --muted:#61788f;
  --border:#cfdeec;
  --soft:rgba(23,79,155,.06);
  --green:#16834d;
  --red:#c93636;
  --blue:#226cc5;
  --pnc-shadow-card:0 8px 24px rgba(16,42,67,.10);
  --pnc-shadow-float:0 14px 36px rgba(16,42,67,.18);
}
body:not(.light){color-scheme:dark}

/* Light surfaces and readable content */

/* Scrollable menu: dynamic viewport, momentum scroll and safe-area room. */

.menu.show{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-gutter:stable}

'use strict';

/* =========================================================
   JNC v2.5.15 — TOKEN VISUAL POLISH
   ---------------------------------------------------------
   - Price token logos are enlarged by CSS size only.
   - NFT / Collection card payment badges use the plain ERC20 symbol
     (JPYC / PICH) without changing token identity or logo loading.
   - Payment routing, decimals, Marketplace and image sources are unchanged.
   ========================================================= */

/* =========================================================
   JNC v2.5.24 — NEW COLLECTIONS RECENCY WINDOW
   ---------------------------------------------------------
   - Home "New Collections" is newest-first: newest Shop is always at the left edge.
   - Only the newest 30 Shops are rendered in the Home new-collection carousel.
   - Shops beyond the 30-item Home window remain in MarketState / KV and all collection views.
   - Sorting is display-only and never mutates or deletes collection data.
   - A single newestCollections() path owns this Home ordering rule.
   ========================================================= */

/* =========================================================
   JNC v2.5.23 — EDIT SHOP RECOVERY ISOLATION
   ---------------------------------------------------------
   - Manual Edit Shop selection now becomes authoritative immediately.
   - Stale Mobile Work Recovery values from the previously selected Shop
     are cleared before the newly selected Shop is rendered.
   - Mobile/background work recovery remains enabled for the active Shop.
   - Mint / List / Buy / Offer / Auction and Marketplace routing are unchanged.
   ========================================================= */

/* =========================================================
   JNC v2.5.22 — WALLET UI CLEANUP
   ---------------------------------------------------------
   - Removed the speculative unavailable-wallet option from the connection UI.
   - Removed its dead coming-soon handler and translations.
   - The existing MetaMask connection / logout flow is unchanged.
   ========================================================= */

/* =========================================================
   JNC v2.5.21 — NFT EXPLORER CLEANUP
   ---------------------------------------------------------
   - Web3 Tools now exposes one chain-aware block explorer button per NFT.
   - The explorer target is the specific NFT item page:
     /nft/{contractAddress}/{tokenId}.
   - The old duplicated NFT / Contract explorer buttons are removed.
   - Polygon / BNB explorer labels are resolved from the NFT Payment Profile chain.
   - MetaMask import contract / Token ID copy utilities are unchanged.
   ========================================================= */

/* =========================================================
   JNC v2.5.20 — TRANSACTION OUTCOME CONSISTENCY
   ---------------------------------------------------------
   - A mined success receipt can never be downgraded to a transaction failure
     only because a later Marketplace/public-read synchronization is delayed.
   - Receipt polling is chain-bound to the chain used by sendTx and can fall
     back to that chain's configured public RPC if the wallet provider lags.
   - Create Auction has three explicit outcomes: reverted/failed, confirmed +
     synchronized, or confirmed + synchronization pending.
   - No parallel auction/payment path is added; the existing shared transaction
     and Marketplace routes are replaced in place.
   ========================================================= */

/* =========================================================
   JNC v2.5.19 — PAYMENT ENGINE MIGRATION AUDIT
   ---------------------------------------------------------
   - Closes the Polygon/JPYC -> Payment Profile Multi-Chain/Multi-Token migration audit.
   - ERC20 approval writes are explicitly bound to the resolved Payment Profile chain.
   - Marketplace writes carry the resolved chain key through transaction preflight.
   - Buy Now / Finalize re-read authoritative auction state immediately before submission.
   - Offer accept/cancel re-read the authoritative offer and verify its Payment Profile token.
   - Bid-refund withdrawal re-reads the authoritative token-scoped refund before submission.
   - No new parallel payment path is added; all writes continue through executeMarketplaceTransaction.
   ========================================================= */

/* =========================================================
   JNC v2.5.14 — PAYMENT TOKEN DECIMALS RUNTIME FIX
   ---------------------------------------------------------
   - Marketplace deployments are owned by chains, not by individual tokens.
   - Polygon and BNB Smart Chain each use one JNCMarketplace v2.22.0 MultiToken ERC20 deployment.
   - Admin Center Payment Profiles provide the ERC20 token identity.
   - New collaboration tokens do not require a JNC HTML code registration.
   - A token must still be configured + enabled on the chain Marketplace.
   - Listing / Offer / Auction carry the Payment Profile token address.
   - Runtime minimum is read from paymentTokenConfigs(paymentToken).
   - Unsupported chains and unconfigured/disabled tokens fail closed.
   - Default JPYC metadata remains only as the launch/fallback asset, not
     as a whitelist that blocks other Admin Center ERC20 tokens.
   ========================================================= */


/* =========================================================
   JNC v2.5.9 — MOBILE WORK RECOVERY & PUBLIC ADDRESS UX
   - Keeps the v2.5.8 Payment Profile / Lifecycle architecture unchanged.
   - Public Owner / Creator wallet addresses stay shortened but are no longer copy actions.
   - Contract / Token ID / NFT ID Web3 utility copy actions remain available.
   - Creator Center work is captured before mobile background / page suspension.
   - Sensitive Pinata Key / Secret work-in-progress values use session storage only.
   - Non-sensitive Creator Center work keeps the existing wallet-scoped persistent recovery.
   - Recovery is ordered: capture → wallet recovery → render → stable restore.
   - Manual wallet Logout still clears recovery state.
   ========================================================= */


/* =========================================================
   JNC v2.3.10 — AUCTION TRANSACTION VERIFICATION
   ---------------------------------------------------------
   - Cancel Auction now re-reads the authoritative auction ID and struct.
   - NFT escrow ownership is verified before cancellation.
   - Cancellation success is verified by auctionIdByNFT == 0 and ownerOf == seller.
   - Cached UI auction IDs are no longer trusted for cancellation.
   - Approval + Auction are documented as two expected transactions when approval is needed.
   ========================================================= */

let PNC_CURRENT_LANGUAGE=PNC_DEFAULT_LANGUAGE;

function normalizeLanguageCode(language){
  const code=String(language||'').trim().toLowerCase().split('-')[0];
  return PNC_SUPPORTED_LANGUAGES.includes(code)?code:PNC_DEFAULT_LANGUAGE;
}
function readStoredLanguage(){
  try{
    const stored=normalizeLanguageCode(localStorage.getItem(PNC_LANGUAGE_STORAGE_KEY));
    return PNC_AVAILABLE_LANGUAGES.includes(stored)?stored:PNC_DEFAULT_LANGUAGE;
  }catch(e){return PNC_DEFAULT_LANGUAGE;}
}
function persistLanguage(language){
  try{localStorage.setItem(PNC_LANGUAGE_STORAGE_KEY,language);}
  catch(e){console.warn('Language preference could not be saved:',e);}
}
function getLanguage(){return PNC_CURRENT_LANGUAGE;}
function locale(language=getLanguage()){return PNC_LOCALES[normalizeLanguageCode(language)]||PNC_LOCALES[PNC_DEFAULT_LANGUAGE];}

/* =========================================================
   JNC v2.3.6 — PRODUCTION AUDIT FIX
   ---------------------------------------------------------
   Registry rules:
   1. A chain describes the EVM network itself.
   2. A deployment binds JNC contracts to one chain.
   3. A payment asset describes the settlement currency for a deployment.
   4. Only an enabled deployment + enabled payment asset may be selected.
   5. Empty addresses are intentional placeholders and must never be used.

   Polygon production owns the deployed NFT, Multi-Token Marketplace and
   fee-wallet addresses. Payment tokens are no longer part of deployment
   identity: Admin Center Payment Profiles select ERC20 tokens dynamically.

   JPYC remains the default launch asset. Each ERC20 token must be configured
   and enabled on the active chain Marketplace before any write is allowed.
   ========================================================= */
const JNC_CONFIGURATION_VERSION='2.5.24';
/* =========================================================
   JNC v2.5.1 — ADMIN REGISTRY FOUNDATION
   ---------------------------------------------------------
   - Reads enabled Chain × Payment Token records from
     /api/load-collaboration.
   - Keeps the remote registry separate from the verified Polygon/JPYC
     production registries in this release.
   - A remote read failure never disables the existing JNC marketplace.
   - No Marketplace, Mint, List, Buy, Offer or Auction route is changed here.
   ========================================================= */
const JNC_ADMIN_REGISTRY_ENDPOINT='/api/load-collaboration';
let JNC_ADMIN_PAYMENT_TOKEN_REGISTRY=Object.freeze([]);
let JNC_ADMIN_REGISTRY_STATUS=Object.freeze({
  loaded:false,
  count:0,
  activeCount:0,
  updatedAt:'',
  error:''
});

function normalizeCollaborationLifecycle(record){
  const now=Date.now();
  const lifecycle=record&&typeof record.lifecycle==='object'&&record.lifecycle?record.lifecycle:{};
  const raw=String(lifecycle.status||record?.status||record?.state||'').trim().toLowerCase();
  const startsAt=String(lifecycle.startsAt||record?.startsAt||record?.startAt||record?.startDate||'').trim();
  const endsAt=String(lifecycle.endsAt||record?.endsAt||record?.endAt||record?.endDate||'').trim();
  const startMs=startsAt?Date.parse(startsAt):NaN;
  const endMs=endsAt?Date.parse(endsAt):NaN;
  let status='';
  if(['active','started','live','running','enabled'].includes(raw))status='active';
  else if(['upcoming','scheduled','pending','draft'].includes(raw))status='upcoming';
  else if(['stopped','stop','paused','disabled','inactive'].includes(raw))status='stopped';
  else if(['ended','end','finished','closed','expired'].includes(raw))status='ended';
  if(Number.isFinite(endMs)&&now>=endMs)status='ended';
  else if(Number.isFinite(startMs)&&now<startMs)status='upcoming';
  else if(!status)status=record?.enabled===true?'active':'stopped';
  const canCreate=status==='active'&&record?.enabled!==false;
  return Object.freeze({status,canCreate,startsAt,endsAt});
}

function normalizeAdminRegistryRecord(record){
  if(!record)return null;
  const chain=record.chain||{};
  const paymentToken=record.paymentToken||{};
  const chainKey=String(chain.key||'').trim().toLowerCase();
  const chainId=Number(chain.chainId);
  const tokenAddress=String(paymentToken.address||'').trim();
  const tokenSymbol=String(paymentToken.symbol||'').trim().toUpperCase();
  if(!chainKey||!Number.isInteger(chainId)||chainId<=0)return null;
  if(!/^0x[a-fA-F0-9]{40}$/.test(tokenAddress)||!tokenSymbol)return null;
  const lifecycle=normalizeCollaborationLifecycle(record);
  return Object.freeze({
    projectId:String(record.projectId||`${chainKey}-${tokenSymbol.toLowerCase()}`).trim(),
    enabled:record.enabled!==false,
    lifecycle,
    chain:Object.freeze({
      key:chainKey,
      name:String(chain.name||chainKey).trim(),
      chainId,
      nativeSymbol:String(chain.nativeSymbol||'').trim().toUpperCase()
    }),
    paymentToken:Object.freeze({
      name:String(paymentToken.name||tokenSymbol).trim(),
      symbol:tokenSymbol,
      displaySymbol:String(paymentToken.displaySymbol||`$${tokenSymbol}`).trim(),
      address:tokenAddress,
      decimals:Number.isInteger(Number(paymentToken.decimals))&&Number(paymentToken.decimals)>=0&&Number(paymentToken.decimals)<=255
        ?Number(paymentToken.decimals):null,
      logoUrl:String(paymentToken.logoUrl||'').trim(),
      logoCid:String(paymentToken.logoCid||'').trim()
    }),
    updatedAt:String(record.updatedAt||'').trim()
  });
}

async function loadAdminPaymentTokenRegistry(){
  try{
    const response=await fetch(JNC_ADMIN_REGISTRY_ENDPOINT,{cache:'no-store'});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    const payload=await response.json();
    if(!payload||payload.ok!==true||!Array.isArray(payload.collaborations)){
      throw new Error('Invalid Admin registry response.');
    }
    const records=payload.collaborations.map(normalizeAdminRegistryRecord).filter(Boolean);
    JNC_ADMIN_PAYMENT_TOKEN_REGISTRY=Object.freeze(records);
    JNC_ADMIN_REGISTRY_STATUS=Object.freeze({
      loaded:true,
      count:records.length,
      activeCount:records.filter(item=>item.lifecycle.canCreate).length,
      updatedAt:new Date().toISOString(),
      error:''
    });
    console.info('[JNC Admin Registry]',JNC_ADMIN_REGISTRY_STATUS,JNC_ADMIN_PAYMENT_TOKEN_REGISTRY);
    return JNC_ADMIN_PAYMENT_TOKEN_REGISTRY;
  }catch(error){
    JNC_ADMIN_REGISTRY_STATUS=Object.freeze({
      loaded:false,
      count:JNC_ADMIN_PAYMENT_TOKEN_REGISTRY.length,
      activeCount:0,
      updatedAt:new Date().toISOString(),
      error:error?.message||String(error)
    });
    console.warn('[JNC Admin Registry] New creation paused; existing asset operation preserved:',error);
    return JNC_ADMIN_PAYMENT_TOKEN_REGISTRY;
  }
}

function getAdminPaymentTokenRegistry(){
  return JNC_ADMIN_PAYMENT_TOKEN_REGISTRY;
}

function getAdminPaymentProfileByProjectId(projectId){
  return getAdminPaymentTokenRegistry().find(profile=>String(profile.projectId)===String(projectId))||null;
}

function isAdminPaymentProfileActive(profileOrProjectId){
  if(!JNC_ADMIN_REGISTRY_STATUS.loaded)return false;
  const profile=typeof profileOrProjectId==='object'&&profileOrProjectId
    ?getAdminPaymentProfileByProjectId(profileOrProjectId.projectId)
    :getAdminPaymentProfileByProjectId(profileOrProjectId);
  return !!profile?.lifecycle?.canCreate;
}

function assertAdminPaymentProfileActive(projectId,label='Payment Profile'){
  if(!JNC_ADMIN_REGISTRY_STATUS.loaded){
    throw new Error('Admin Center registry is unavailable. New creation is temporarily paused; existing NFTs remain usable.');
  }
  const profile=getAdminPaymentProfileByProjectId(projectId);
  if(!profile)throw new Error(`${label} is no longer registered in Admin Center.`);
  if(!profile.lifecycle.canCreate){
    throw new Error(`${label} is ${profile.lifecycle.status}. New Shop / NFT creation is not available for this collaboration.`);
  }
  return profile;
}

function findEvmChainByProfile(profile){
  const rawChainId=profile?.chain?.chainId; let normalized='';
  try{normalized=normalizeChainId(rawChainId);}catch(_){}
  const key=String(profile?.chain?.key||profile?.chain?.id||'').trim().toLowerCase();
  const chain=Object.values(JNC_CHAIN_REGISTRY).find(item=>item.family==='evm'&&((key&&item.id===key)||(normalized&&normalizeChainId(item.chainId)===normalized)));
  if(!chain){const error=new Error(`Unsupported EVM chain in Payment Profile: ${profile?.chain?.name||rawChainId||key||'(unknown)'}.`);error.code='PAYMENT_PROFILE_CHAIN_UNSUPPORTED';throw error;}
  return chain;
}
function createPaymentAssetFromProfile(profile,chain){
  const token=profile?.paymentToken||{};
  const contractAddress=String(token.address||'').trim();
  if(!isValidEvmAddress(contractAddress)){
    const error=new Error('The Payment Profile ERC20 token address is invalid.');
    error.code='PAYMENT_PROFILE_TOKEN_INVALID';
    throw error;
  }
  const decimals=Number.isInteger(Number(token.decimals))?Number(token.decimals):(
    lc(contractAddress)===lc(JNC_DEFAULT_SHOP_PAYMENT_PROFILE.paymentToken.address)?18:null
  );
  return Object.freeze({
    id:String(profile?.projectId||`${chain.id}:${contractAddress.toLowerCase()}`),
    chainKey:chain.id,
    type:'erc20',
    symbol:String(token.symbol||'ERC20').trim().toUpperCase(),
    name:String(token.name||token.symbol||'ERC20').trim(),

  if(!deployment){
    const error=new Error(`${chain.name} has no enabled JNC Multi-Token Marketplace deployment yet.`);
    error.code='PAYMENT_PROFILE_DEPLOYMENT_UNAVAILABLE';
    error.profile=profile;
    error.chain=chain;
    throw error;

  if(!deployment.multiToken){
    const error=new Error(`${chain.name} Marketplace is not Multi-Token enabled.`);
    error.code='PAYMENT_PROFILE_MULTITOKEN_UNAVAILABLE';

/* =========================================================
   JNC v2.5.18 — ERC20 CHAIN-BOUND ALLOWANCE VERIFICATION
   ---------------------------------------------------------
   ERC20 balance/allowance reads are bound to the Payment Profile chain.
   Explicit chain context takes precedence over address inference so the
   approval write and its verification read cannot diverge across EVM chains.
   One allowance path is retained; no parallel legacy verifier is added.
   ========================================================= */
function encodeERC20BalanceOfCall(account){return '0x70a08231'+addrWord(account);}
function encodeERC20AllowanceCall(owner,spender){return '0xdd62ed3e'+addrWord(owner)+addrWord(spender);}
function encodeERC20ApproveCall(spender,amount){return '0x095ea7b3'+addrWord(spender)+toHex(amount).slice(2);}
async function readERC20Balance(tokenAddress,account,chainOrKey=null){return BigInt(await ethCall(tokenAddress,encodeERC20BalanceOfCall(account),chainOrKey)||'0x0');}
async function readERC20Allowance(tokenAddress,owner,spender,chainOrKey=null){return BigInt(await ethCall(tokenAddress,encodeERC20AllowanceCall(owner,spender),chainOrKey)||'0x0');}
async function readERC20AllowanceWithRetry(tokenAddress,owner,spender,requiredAmount,chainOrKey=null,attempts=10,delayMs=750){
  const required=BigInt(requiredAmount||0);
  let allowance=0n;
  for(let attempt=0;attempt<attempts;attempt++){
    allowance=await readERC20Allowance(tokenAddress,owner,spender,chainOrKey);
    if(allowance>=required)return allowance;
    if(attempt<attempts-1)await sleep(delayMs);
  }
  return allowance;
}
async function sendERC20Approval(tokenAddress,owner,spender,amount,label,chainOrKey){
  const chain=chainConfigFrom(chainOrKey);
  const txHash=await sendTx({from:owner,to:tokenAddress,data:encodeERC20ApproveCall(spender,amount),chainKey:chain.id});
  const receipt=await waitForReceipt(txHash);
  assertSuccessfulReceipt(receipt,label);
  return txHash;
}
async function ensureERC20Allowance({tokenAddress,owner,spender,requiredAmount,chainOrKey=null}){
  const required=BigInt(requiredAmount||0);
  const current=await readERC20Allowance(tokenAddress,owner,spender,chainOrKey);
  if(current>=required)return{approved:false,allowance:current,txHash:null};

  let resetTxHash=null;
  if(current>0n){
    resetTxHash=await sendERC20Approval(tokenAddress,owner,spender,0n,'ERC20 allowance reset',chainOrKey);
    const resetAllowance=await readERC20AllowanceWithRetry(tokenAddress,owner,spender,0n,chainOrKey,6,500);
    if(resetAllowance!==0n)throw new Error('ERC20 allowance reset was not reflected.');
  }

  const txHash=await sendERC20Approval(tokenAddress,owner,spender,required,'ERC20 approve',chainOrKey);
  const allowance=await readERC20AllowanceWithRetry(tokenAddress,owner,spender,required,chainOrKey,12,750);
  if(allowance<required){
    throw new Error(`ERC20 allowance verification timed out. required=${required} actual=${allowance}`);
  }
  return{approved:true,allowance,txHash,resetTxHash};
}

function normalizeMarketplacePaymentRequest(request={},context){
  const from=String(request.from||'').trim();
  const to=String(request.to||context?.deployment?.contracts?.marketplace||'').trim();
  const data=String(request.data||'0x').trim();
  const amount=BigInt(request.amount??request.requiredAmount??0);
  const label=String(request.label||'Marketplace payment');
  if(!/^0x[a-fA-F0-9]{40}$/.test(from))throw new Error('Payment sender is invalid.');
  if(!/^0x[a-fA-F0-9]{40}$/.test(to))throw new Error('Payment target is invalid.');
  if(!/^0x[a-fA-F0-9]*$/.test(data))throw new Error('Payment calldata is invalid.');
  if(amount<0n)throw new Error('Payment amount cannot be negative.');
  return Object.freeze({from,to,data,amount,label});
}

async function payERC20(request,context){
  const payment=normalizeMarketplacePaymentRequest(request,context);
  const {asset,deployment,tokenAddress,symbol,chain}=context;
  if(asset.type!=='erc20')throw new Error('The selected Marketplace payment asset is not ERC20.');
  if(!asset.enabled)throw new Error(`ERC20 payment asset is disabled: ${asset.id}`);
  if(!isValidEvmAddress(tokenAddress))throw new Error('ERC20 Payment Profile token is not configured.');
  if(lc(payment.to)!==lc(deployment.contracts.marketplace))throw new Error('ERC20 Marketplace payment target does not match the resolved deployment.');
  const balance=await readERC20Balance(tokenAddress,payment.from,chain);
  if(balance<payment.amount)throw new Error(`Insufficient ${symbol} balance.`);
  const approval=await ensureERC20Allowance({tokenAddress,owner:payment.from,spender:payment.to,requiredAmount:payment.amount,chainOrKey:chain});
  const txHash=await sendTx({from:payment.from,to:payment.to,data:payment.data,chainKey:chain.id});
  return Object.freeze({engine:'erc20',txHash,approval,paymentProfile:context.profile});
}

async function executeMarketplacePayment(request,nftOrProfile){
  assertPaymentAudit();
  const context=getMarketplacePaymentEngine(nftOrProfile);
  if(context.engine.id==='erc20')return payERC20(request,context);
  throw new Error(`No Marketplace payment route for: ${context.engine.id}`);
}

  const label=String(request.label||definition.id||'Marketplace transaction');
  const amount=BigInt(request.amount??0);
  const payment=definition.payment===true;
  const profileSource=request.nft||request.paymentProfile||null;
  const route=profileSource?resolveMarketplacePaymentRoute(profileSource):null;
  if(Object.prototype.hasOwnProperty.call(request,'payment')&&request.payment!==payment)throw new Error(`Marketplace payment mode mismatch for action: ${action}`);
  const target=String((route?.deployment||architecture.deployment).contracts[definition.contractRole]||'').trim();
  if(!isValidEvmAddress(from))throw new Error('Marketplace sender is invalid.');
  if(!isValidEvmAddress(target))throw new Error(`Marketplace contract role is invalid: ${definition.contractRole}`);
  if(!isValidCalldata(data)||data.length<10)throw new Error('Marketplace calldata is invalid.');
  if(amount<0n)throw new Error('Marketplace amount cannot be negative.');
  if(payment&&amount<=0n)throw new Error('Marketplace payment amount must be greater than zero.');
  if(payment&&!route)throw new Error('Marketplace payment action requires an NFT Payment Profile.');
  if(definition.minimumRule&&amount>0n&&!route)validateMarketplaceMinimum(action,amount);
  return Object.freeze({action,definition,from,to:target,data,label,amount,payment,architecture,route,profileSource});
}
async function executeMarketplaceTransaction(request={}){
  assertPaymentAudit();
  assertMarketplaceIntegration();
  assertProductionArchitectureAudit();
  const tx=normalizeMarketplaceTransactionRequest(request);
  await switchToConfiguredChain(tx.route?.chain||tx.architecture.chain);
  if(tx.route){
    const tokenGate=await assertMarketplacePaymentTokenEnabled(tx.profileSource);
    if(tx.definition.minimumRule&&tx.amount>0n&&BigInt(tx.amount)<BigInt(tokenGate.config.minimumPaymentAmount||'0')){
      const error=new Error(`Marketplace ${tx.action} amount is below the configured ${tx.route.symbol} minimum.`);
      error.code='MARKETPLACE_MINIMUM';
      throw error;
    }
  }
  const accounts=await ethereum.request({method:'eth_accounts'});
  if(!accounts?.[0]||lc(accounts[0])!==lc(tx.from))throw new Error(t('systemTx.walletChanged'));
  if(tx.payment)return executeMarketplacePayment({from:tx.from,to:tx.to,data:tx.data,amount:tx.amount,label:tx.label},tx.profileSource);
  const txHash=await sendTx({from:tx.from,to:tx.to,data:tx.data,chainKey:(tx.route?.chain||tx.architecture.chain).id});
  return Object.freeze({engine:'transaction',txHash,approval:null,action:tx.action,contractRole:tx.definition.contractRole,paymentProfile:tx.route?.profile||null});
}


/* =========================================================
   JNC v2.3.6 — PRODUCTION AUDIT ENGINE
   ---------------------------------------------------------
   One fail-closed audit path verifies the active chain, deployment,
   payment asset, payment engine, contract addresses, decimals and minimum
   units before Marketplace writes are allowed. Disabled future deployments
   may retain placeholders, but the active deployment may not.
   ========================================================= */
const JNC_PAYMENT_AUDIT_VERSION='2.5.20-transaction-outcome-consistency';
function paymentAuditCheck(id,ok,detail=''){
  return Object.freeze({id,ok:!!ok,detail:String(detail||'')});
}
function runPaymentAudit(){
  const checks=[];
  let architecture=null;
  try{
    architecture=validateActiveArchitecture();
    checks.push(paymentAuditCheck('activeArchitecture',true,architecture.deployment.id));
  }catch(error){
    checks.push(paymentAuditCheck('activeArchitecture',false,error.message||error));
    return Object.freeze({version:JNC_PAYMENT_AUDIT_VERSION,ok:false,checks,architecture:null});
  }
  const {deployment,chain,asset,environment,configuration}=architecture;
  checks.push(paymentAuditCheck('environmentEnabled',environment.enabled===true,environment.id));
  checks.push(paymentAuditCheck('marketplaceWritesAllowed',environment.allowMarketplaceWrites===true,String(environment.allowMarketplaceWrites)));
  checks.push(paymentAuditCheck('chainEnabled',chain.enabled===true,chain.id));
  checks.push(paymentAuditCheck('deploymentEnabled',deployment.enabled===true,deployment.id));
  checks.push(paymentAuditCheck('defaultAssetChainMatch',deployment.chainKey===asset.chainKey,`${deployment.chainKey}/${asset.chainKey}`));
  checks.push(paymentAuditCheck('nftContract',isValidEvmAddress(deployment.contracts.nft),deployment.contracts.nft));
  checks.push(paymentAuditCheck('marketplaceContract',isValidEvmAddress(deployment.contracts.marketplace),deployment.contracts.marketplace));
  checks.push(paymentAuditCheck('feeWallet',isValidEvmAddress(deployment.contracts.feeWallet),deployment.contracts.feeWallet));
  checks.push(paymentAuditCheck('paymentEngine',!!JNC_PAYMENT_ENGINES[asset.type],asset.type));
  checks.push(paymentAuditCheck('marketplaceIntegration',JNC_MARKETPLACE_INTEGRATION_REPORT.ok,String(JNC_MARKETPLACE_INTEGRATION_REPORT.ok)));
  checks.push(paymentAuditCheck('marketplaceActionRegistry',Object.keys(JNC_MARKETPLACE_ACTION_REGISTRY).length===14,String(Object.keys(JNC_MARKETPLACE_ACTION_REGISTRY).length)));
  checks.push(paymentAuditCheck('assetDecimals',Number.isInteger(asset.decimals)&&asset.decimals>=0&&asset.decimals<=255,String(asset.decimals)));
  if(asset.type==='native'){
    checks.push(paymentAuditCheck('nativeAssetNoTokenAddress',!asset.contractAddress,'native'));
  }else if(asset.type==='erc20'){
    checks.push(paymentAuditCheck('erc20TokenAddress',isValidEvmAddress(asset.contractAddress),asset.contractAddress));
    checks.push(paymentAuditCheck('erc20MinimumUnits',getConfiguredAssetMinimumBaseUnits(asset)!==null,String(asset.minimumBaseUnits??'')));
  }else{
    checks.push(paymentAuditCheck('supportedAssetType',false,asset.type));
  }
  const ok=checks.every(check=>check.ok);
  return Object.freeze({version:JNC_PAYMENT_AUDIT_VERSION,ok,checks:Object.freeze(checks),architecture});
}
function assertPaymentAudit(){
  const report=runPaymentAudit();
  if(report.ok)return report;
  const failed=report.checks.filter(check=>!check.ok).map(check=>`${check.id}${check.detail?`: ${check.detail}`:''}`);
  const error=new Error(`Payment Audit failed: ${failed.join(', ')}`);
  error.code='PAYMENT_AUDIT_FAILED';
  error.report=report;
  throw error;
}
const JNC_PAYMENT_AUDIT_REPORT=assertPaymentAudit();

function isOnChainNFT(nft){
  if(!nft||!nft.tokenId||!isValidEvmAddress(nft.contractAddress))return false;
  const deployment=getDeploymentByNftContract(nft.contractAddress);
  return !!deployment&&getNFTChainKey(nft)===deployment.chainKey;
}
function marketplacePermissionContext(nft,state=PNC_STATE){
  const wallet=lc(state?.wallet),owner=lc(nft?.owner),creator=lc(nft?.creator);
  const auctionActive=!!(nft?.auction&&nft.auction.active);
  return Object.freeze({wallet,owner,creator,auctionActive,isOwner:!!wallet&&wallet===owner,isOnChain:isOnChainNFT(nft),isListed:nft?.status==='listed',hasOffers:Array.isArray(nft?.offers)&&nft.offers.length>0});
}
function canBuyNFT(nft,state=PNC_STATE){const c=marketplacePermissionContext(nft,state);return !!c.wallet&&c.isOnChain&&c.isListed&&!c.isOwner&&!c.auctionActive;}
function canListNFT(nft,state=PNC_STATE){const c=marketplacePermissionContext(nft,state);return c.isOnChain&&c.isOwner&&!c.isListed&&!c.auctionActive&&nft?.status!=='market_read_error';}
function canUnlistNFT(nft,state=PNC_STATE){const c=marketplacePermissionContext(nft,state);return c.isOnChain&&c.isOwner&&c.isListed&&!c.auctionActive;}
function canEnableOffersNFT(nft,state=PNC_STATE){const c=marketplacePermissionContext(nft,state);return c.isOnChain&&c.isOwner&&!nft?.originRegistered&&c.owner===c.creator&&!c.auctionActive;}
function canOfferNFT(nft,state=PNC_STATE){const c=marketplacePermissionContext(nft,state);return !!c.wallet&&c.isOnChain&&!c.isOwner&&!!nft?.originRegistered&&!c.auctionActive;}
function canAuctionNFT(nft,state=PNC_STATE){const c=marketplacePermissionContext(nft,state);return c.isOnChain&&c.isOwner&&!c.isListed&&!c.auctionActive&&!c.hasOffers&&nft?.status!=='market_read_error';}

    {heading:'1. ウォレットを接続',body:'右上の「Connect」ボタンから対応ウォレットを接続します。接続されたアカウントを確認し、トランザクションを承認する前に、ウォレットに表示される内容を毎回確認してください。'},
    {heading:'2. 作成とミント',body:'Creator Centerを開き、ショップを作成した後にNFTを作成します。メディアとメタデータをPinataへアップロードし、プレビューを確認してからウォレットでミントトランザクションを承認します。'},
    {heading:'3. My Vaultと販売',body:'ミントが確定すると、オンチェーン所有権を基準にNFTがMy Vaultへ表示されます。Creator Centerでミント済みNFTを選び、必要に応じて出品、オファー、オークションを利用します。'}
  ]},
  creatorGuide:{title:'クリエイターガイド',updated:'2026年7月25日',sections:[
    {heading:'ショップ作成',body:'ショップ名、説明、画像、任意のSNSリンクを入力します。新しいNFTで選択する前にショップを登録してください。'},
    {heading:'NFT作成',body:'ショップを選択し、NFT名、説明、メディア、ユーティリティ情報を入力して下書きを作成します。ミント前にメディアとメタデータをPinataへアップロードしてください。'},
    {heading:'ミントと管理',body:'ウォレットでミントトランザクションを承認します。確定したNFTはMy VaultとCreator Centerから管理します。NFT作成時に販売設定は行わず、ミント後に出品します。'},
    {heading:'出品と出品取消',body:'NFTを出品または出品取消できるのは、現在のオンチェーン所有者だけです。確定前に表示価格とウォレットのトランザクション内容を確認してください。'}
  ]},
  nftSpecifications:{title:'NFT仕様',updated:'2026年7月25日',sections:[
    {heading:'🖼 画像',body:'対応形式はJPG、PNG、WebPです。JNCでは新しくアップロードされた画像をマーケット表示用に最適化します。NFTカードと詳細画面で安定して表示するため、正方形画像を推奨します。'},
    {heading:'🎥 動画',body:'対応形式はMP4です。読み込みと再生を安定させるため、動画NFTは5〜6秒程度以下を推奨します。音声にも対応しています。NFTカードと動画再生前のポスターには、別途サムネイル画像が必要です。'},
    {heading:'📄 メタデータ',body:'JNCはNFT名、説明、画像またはサムネイル参照、動画NFT用のanimation_url、その他のクリエイター入力情報を含むmetadata.jsonを作成してアップロードします。NFT名、ショップ名、説明はクリエイターが入力した言語のまま表示されます。'},
    {heading:'📦 ストレージ',body:'NFTメディアとメタデータはPinataへアップロードされ、IPFSを通じて保存されます。IPFS上のコンテンツはJNCの画面とは独立して参照できる場合があります。ミント前にプレビューとメタデータを確認してください。'},
    {heading:'⛓ ブロックチェーン',body:'JNCはブロックチェーン上のNFTを使用し、ownerOf(tokenId)などの確定済みオンチェーン記録から所有権を確認します。接続中のウォレットがミント、出品、取引、送信を承認し、デプロイ済みコントラクトが利用可能なマーケット操作を定めます。'},
    {heading:'💰 マーケット手数料',body:'初回販売はクリエイター／出品者95％、マーケット手数料5％です。再販は出品者85％、元のクリエイターへのロイヤリティ10％、マーケット手数料5％です。ネットワークガス代は別途発生します。実際のオンチェーン分配はデプロイ済みスマートコントラクトが処理します。'},
    {heading:'🔒 所有権',body:'NFTのミントはトークンを作成しますが、著作権や商用利用権を自動的に移転するものではありません。ブロックチェーン操作は接続中のウォレットが行い、通常は現在のオンチェーン所有者だけがNFTの出品、出品取消、送信を実行できます。'},
    {heading:'🌍 対応言語',body:'JNCのインターフェースは英語、日本語、韓国語、ロシア語に対応しています。ユーザーが作成したNFTやショップの内容は、クリエイターが入力した言語のまま表示され、自動翻訳されません。'}
  ]},
  auctionGuide:{title:'オークションガイド',updated:'2026年7月25日',sections:[
    {heading:'オークション開始',body:'NFT所有者が開始日時、期間、開始価格、任意の即決価格を設定します。オークション中、NFTはMarketplaceコントラクトへ移されます。'},
    {heading:'入札と即決購入',body:'入札ごとにウォレットトランザクションが必要です。有効な即決購入が行われると、オークションはただちに終了します。終了間際の条件を満たす入札では、自動延長ルールにより終了時刻が延長される場合があります。'},
    {heading:'落札できなかった場合',body:'落札できなかった入札額は自動では返金されません。オークション終了後、対象NFTカードに表示される「Refund」ボタンから返金を受け取り、ウォレットで返金トランザクションを承認してください。'},
    {heading:'確定処理',body:'オークション終了後にFinalizeを実行すると、NFTの移転と代金分配が完了します。Finalizeにはブロックチェーントランザクションとガス代が必要な場合があります。'}
  ]},
  faq:{title:'よくある質問',updated:'2026年7月25日',sections:[
    {heading:'ミントまたは購入したNFTはどこにありますか？',body:'現在NFTを所有するウォレットを接続してMy Vaultを開いてください。My Vaultはオンチェーン所有権を基準に表示します。'},
    {heading:'オークション返金がウォレットに表示されないのはなぜですか？',body:'落札できなかった入札の返金は自動ではありません。オークション終了後、対象NFTカードの「Refund」ボタンを使用し、ウォレットで返金トランザクションを承認してください。'},
    {heading:'ガス代とは何ですか？',body:'ガス代はブロックチェーンでトランザクションを処理するためにネットワークへ支払う費用です。JNCのマーケット手数料とは別です。'},
    {heading:'Pendingとは何ですか？',body:'ウォレットまたはブロックチェーンがトランザクションを処理中です。同じ操作を繰り返し送信せず、まずウォレットとトランザクションの状態を確認してください。'},
    {heading:'画面表示とブロックチェーンが違うのはなぜですか？',body:'データ更新中に一時的な遅延が起きる場合があります。最終的にはオンチェーン所有権と確定済みコントラクト記録が基準です。'}
  ]},
  terms:{title:'利用規約',updated:'2026年7月17日',sections:[
    {heading:'1. サービス',body:'JPYC NFT Center（JNC）は、NFTの作成、表示、出品、オファー、オークション、購入、送信を行うためのノンカストディアル型インターフェースを提供します。JNCは銀行、証券会社、投資助言業者、資産保管業者ではありません。'},
    {heading:'2. ウォレットとアクセス',body:'ユーザーは対応ウォレットを接続してブロックチェーン機能を使用します。ウォレット、秘密鍵、シードフレーズ、パスワード、端末、承認、アカウントの安全管理はユーザー自身の責任です。JNCが秘密鍵やシードフレーズを要求、取得、保存することはありません。'},
    {heading:'3. NFTとユーザーコンテンツ',body:'クリエイターは、アップロードまたはミントする画像、メディア、メタデータ、説明、ユーティリティ、表明、その他のコンテンツに責任を負います。ユーザーはそのコンテンツに必要な権利と許可を保有していなければなりません。権利者が別途明示しない限り、NFTのミントや取引だけで著作権や商用利用権が移転することはありません。'},
    {heading:'4. マーケット取引',body:'出品者が価格とオークション条件を設定します。ブロックチェーントランザクションは確定後に取り消せない場合があります。一時的な画面表示と異なる場合、オンチェーンの所有権、取引、出品、オファー、入札、購入、オークション記録が最終基準です。'},
    {heading:'5. オファー、オークション、即決購入',body:'オファーでは資金がMarketplaceコントラクトへ預けられる場合があります。オークションには開始日時、開始価格、即決価格、自動延長、返金、誰でも実行できる確定処理が含まれる場合があります。ウォレットで承認する前にトランザクション内容を確認してください。'},
    {heading:'6. 手数料',body:'マーケット手数料とクリエイターロイヤリティは手数料ページに記載します。ネットワークガス代は別途発生し、JNCではなくブロックチェーンネットワークへ支払われます。適用料率は合理的な事前通知により変更される場合があります。'},
    {heading:'7. 禁止行為',body:'盗用作品、違法コンテンツ、権利侵害コンテンツ、虚偽または誤解を招くメタデータ、なりすまし、詐欺、スパム、悪意あるコード、不正ボット、相場操縦、他者の権利を侵害するコンテンツをアップロードまたは取引してはなりません。'},
    {heading:'8. 利用制限と表示削除',body:'JNCは、インターフェースへのアクセス制限、コンテンツの非表示、適法な行政機関や権利者からの申立てへの対応を行う場合があります。ブロックチェーン記録やIPFSコンテンツはJNCのインターフェースとは独立して残る場合があります。'},
    {heading:'9. 無保証と責任制限',body:'本サービスは「現状有姿」かつ「提供可能な範囲」で提供されます。法令で認められる最大限の範囲で、JNCは中断のない利用、スマートコントラクトの無欠陥、資産価値、取引完了、失われたウォレットへのアクセス回復を保証しません。'},
    {heading:'10. 変更',body:'JNCは、サービス、対応ネットワーク、法令、機能の変更に応じて本規約を更新する場合があります。更新後も利用を継続した場合、改定後の規約に同意したものとみなされます。'}
  ]},
  privacy:{title:'プライバシーポリシー',updated:'2026年7月17日',sections:[
    {heading:'1. 処理する情報',body:'JNCは、マーケットプレイスの運営に必要な公開ウォレットアドレス、コレクション情報、NFT情報、メタデータ、トランザクションハッシュ、コントラクトイベント、ネットワーク情報、ユーザー提供コンテンツを処理する場合があります。'},
    {heading:'2. 収集しない情報',body:'JNCは秘密鍵、シードフレーズ、ウォレットパスワード、クレジットカード情報、ウォレット内資金を要求または保存しません。ウォレット接続だけで、ユーザーの実名や非公開の連絡先が自動的に開示されることはありません。'},
    {heading:'3. 保存先とインフラ',body:'公開NFTメディアとメタデータはPinataおよびIPFSに保存される場合があります。アプリ状態はVercelサービス、ブラウザのlocalStorage、関連インフラに保存される場合があります。ブロックチェーントランザクションは公開され、永続的に残る可能性があります。'},
    {heading:'4. ブラウザデータ',body:'JNCは下書き、メタデータキャッシュ、表示設定、マーケット状態を保持するためにlocalStorageなどのブラウザ保存機能を使用する場合があります。サービス運営に必要な保存機能を使用します。分析用または必須でないCookieを導入する場合は別途開示します。'},
    {heading:'5. 外部サービス',body:'JNCはウォレットプロバイダー、ブロックチェーンネットワーク、RPCサービス、Pinata、IPFS、Vercel、関連するホスティングおよび保存事業者などの第三者インフラを利用します。各事業者のポリシーが適用される場合があります。'},
    {heading:'6. 共有と開示',body:'JNCは個人情報を販売しません。法令上必要な場合、ユーザーやサービスを保護する場合、不正利用を調査する場合、必要な事業者を通じてサービスを運営する場合に情報を開示することがあります。'},
    {heading:'7. 公開ブロックチェーンに関する注意',body:'ウォレットアドレスとトランザクションは公開情報です。JNCのインターフェースから情報を削除しても、ブロックチェーン記録やIPFSコンテンツは第三者ツールから参照できる場合があります。'},
    {heading:'8. ポリシーの更新',body:'JNCがネットワーク、分析機能、決済手段、その他のサービスを追加する際、本ポリシーを更新する場合があります。'}
  ]},
  fees:{title:'手数料',updated:'2026年7月25日',sections:[
    {heading:'初回販売',body:'クリエイター／出品者：95％\nマーケット手数料：5％'},
    {heading:'再販',body:'出品者：85％\nクリエイターロイヤリティ：10％\nマーケット手数料：5％'},
    {heading:'対象となる取引',body:'固定価格購入、承認されたオファー、成立したオークション、オークション即決購入に、それぞれ該当する分配ルールが適用されます。'},
    {heading:'ネットワーク手数料',body:'ガス代などのブロックチェーン費用はマーケット手数料とは別です。ネットワークとウォレットによって決まり、トランザクションが失敗またはオンチェーンで拒否された場合も通常返金されません。'},
    {heading:'今後の変更',body:'手数料とロイヤリティ規則は、サービスの発展に応じて変更される場合があります。画面上では最新の手数料ページが公開基準となり、各取引の実際のオンチェーン分配はデプロイ済みスマートコントラクトによって処理されます。'}
  ]},
  copyright:{title:'著作権ポリシー',updated:'2026年7月17日',sections:[
    {heading:'1. クリエイターの権利',body:'有効な譲渡またはライセンスがない限り、著作権その他の知的財産権はクリエイターに帰属します。NFTのミントはトークンを記録するものであり、著作者であることを自動的に証明したり、著作権を移転したりするものではありません。'},
    {heading:'2. 購入者の権利',body:'NFTの購入で移転するのはトークンの所有権だけです。別途ライセンス条件で明示的に許諾されない限り、著作権、商用利用権、複製権、二次的著作物を作成する権利は権利者に残ります。'},
    {heading:'3. ユーザーの責任',body:'使用許可のないコンテンツをミント、出品、販売、表示してはなりません。メタデータで著作者、所属、ライセンス、真正性について虚偽の表示をしてはなりません。'},
    {heading:'4. 権利侵害の申告',body:'権利者は、保護対象作品、該当するNFTまたはコレクション、連絡先、誠実な申告、権限を示す資料を添えて権利侵害の疑いを申告できます。JNCは確認中、該当コンテンツをインターフェース上で非表示にする場合があります。'},
    {heading:'5. ブロックチェーンとIPFSの制約',body:'JNCは自らのインターフェース上でコンテンツを制限または削除できますが、分散型システムに保存されたトークン、ブロックチェーン履歴、ファイルを削除できない場合があります。'},
    {heading:'6. DMCAおよび同等の手続',body:'JNCは、適用される著作権法に沿った権利申告手続を整備し、必要に応じてDMCA型の通知および反対通知手続に対応する予定です。'}
  ]},
  disclaimer:{title:'免責事項',updated:'2026年7月25日',sections:[
    {heading:'サービスの提供状況',body:'JNCの機能、対応ウォレット、コントラクト、データ取得元、提供状況は、サービスの発展に応じて変更される場合があります。トランザクションを実行する前に、現在の画面表示、コントラクト情報、手数料、ウォレットの確認内容を毎回確認してください。'},
    {heading:'投資助言ではありません',body:'JNC上の情報は、金融、投資、法律、税務、会計上の助言ではありません。NFT価格は投機的で、価値がゼロになる可能性があります。ユーザーは自ら判断し、必要に応じて専門家へ相談してください。'},
    {heading:'ウォレットのリスク',body:'JNCは秘密鍵、シードフレーズ、パスワード、紛失した端末、侵害されたウォレットを復旧できません。ウォレット承認とトランザクション確認はユーザーとウォレットプロバイダーが管理します。'},
    {heading:'ブロックチェーンとスマートコントラクトのリスク',body:'トランザクションは失敗、遅延、再編成、または高額になる場合があります。スマートコントラクトに不具合が含まれたり、予期しない動作をしたりする可能性があります。ネットワーク混雑、RPC障害、フォーク、第三者サービスの障害が利用と取引に影響する場合があります。'},
    {heading:'ガス代と返金',body:'ガス代はネットワークへ支払われ、通常返金されません。入札返金などコントラクトで保管された残高を受け取るには、利用可能なオンチェーンの引出処理をユーザー自身で完了する必要があります。'},
    {heading:'第三者コンテンツとサービス',body:'JNCは、ユーザー作成NFTや第三者のサービス、リンク、ウォレット、ゲートウェイ、ホスティング事業者、ブロックチェーンインフラについて、正確性、合法性、真正性、可用性、価値を保証しません。'},
    {heading:'ユーザーの責任',body:'ユーザーは操作前に、NFT内容、所有権、ライセンス、価格、手数料、トランザクション内容、コントラクトアドレス、ネットワーク選択、ウォレット確認画面を確認する責任があります。'}
  ]}
}),

gettingStarted:{title:'시작하기',updated:'2026년 7월 25일',sections:[
{heading:'1. 지갑 연결',body:'오른쪽 위의 Connect 버튼을 사용해 지원되는 지갑을 연결합니다. 연결된 계정을 확인하고 트랜잭션을 승인하기 전에 모든 지갑 요청 내용을 검토하세요.'},
{heading:'2. 생성 및 민트',body:'Creator Center를 열고 샵을 만든 다음 NFT를 생성합니다. 미디어와 메타데이터를 Pinata에 업로드하고 미리보기를 확인한 뒤 지갑에서 민트 트랜잭션을 승인합니다.'},
{heading:'3. My Vault 및 판매',body:'민트가 확정되면 온체인 소유권을 기준으로 NFT가 My Vault에 표시됩니다. Creator Center에서 민트된 NFT를 선택한 뒤 상황에 따라 판매 등록, 오퍼 또는 경매를 이용합니다.'}]},
creatorGuide:{title:'크리에이터 가이드',updated:'2026년 7월 25일',sections:[
{heading:'샵 만들기',body:'샵 이름, 설명, 이미지와 선택 사항인 소셜 링크를 입력합니다. 새 NFT에서 선택하기 전에 샵을 등록하세요.'},
{heading:'NFT 만들기',body:'샵을 선택하고 NFT 이름, 설명, 미디어와 유틸리티 정보를 입력한 뒤 초안을 만듭니다. 민트하기 전에 미디어와 메타데이터를 Pinata에 업로드하세요.'},
{heading:'민트 및 관리',body:'지갑에서 민트 트랜잭션을 승인합니다. 확정된 NFT는 My Vault와 Creator Center에서 관리합니다. 먼저 민트한 뒤 판매 등록하며, NFT 생성 단계에는 판매 설정이 포함되지 않습니다.'},
{heading:'판매 등록 및 취소',body:'현재 온체인 소유자만 NFT를 판매 등록하거나 판매 등록을 취소할 수 있습니다. 확정하기 전에 표시된 가격과 지갑 트랜잭션 내용을 확인하세요.'}]},
nftSpecifications:{title:'NFT 사양',updated:'2026년 7월 25일',sections:[
{heading:'🖼 이미지',body:'지원 형식은 JPG, PNG, WebP입니다. JNC는 새로 업로드된 이미지를 마켓플레이스 표시용으로 최적화합니다. NFT 카드와 상세 페이지에서 일관되게 표시하려면 정사각형 이미지를 권장합니다.'},
{heading:'🎥 동영상',body:'지원 형식은 MP4입니다. 안정적인 로딩과 재생을 위해 동영상 NFT는 약 5~6초 이하로 유지하세요. 오디오를 지원합니다. NFT 카드와 동영상 포스터에 사용할 별도의 썸네일 이미지가 필요합니다.'},
{heading:'📄 메타데이터',body:'JNC는 NFT 이름, 설명, 이미지 또는 썸네일 참조, 동영상 NFT용 animation_url과 기타 크리에이터 입력 정보를 포함한 metadata.json을 생성해 업로드합니다. NFT와 샵의 이름 및 설명은 크리에이터가 입력한 원래 언어로 유지됩니다.'},
{heading:'📦 스토리지',body:'NFT 미디어와 메타데이터는 Pinata에 업로드되고 IPFS를 통해 저장됩니다. IPFS 콘텐츠는 JNC 인터페이스와 별개로 계속 접근 가능할 수 있습니다. 크리에이터는 민트하기 전에 미리보기와 메타데이터를 확인해야 합니다.'},
{heading:'⛓ 블록체인',body:'JNC는 블록체인 기반 NFT를 사용하며 ownerOf(tokenId)와 같은 확정된 온체인 기록을 통해 소유권을 확인합니다. 연결된 지갑은 민트, 판매 등록, 거래와 전송을 승인하며, 배포된 컨트랙트가 이용 가능한 마켓플레이스 기능을 정의합니다.'},
{heading:'💰 마켓플레이스 수수료',body:'최초 판매: 크리에이터/판매자 95%, 마켓플레이스 수수료 5%. 재판매: 판매자 85%, 최초 크리에이터 로열티 10%, 마켓플레이스 수수료 5%. 네트워크 가스비는 별도입니다. 실제 온체인 분배는 배포된 스마트 컨트랙트가 처리합니다.'},
{heading:'🔒 소유권',body:'민트는 NFT 토큰을 생성하지만 저작권이나 상업적 이용권을 자동으로 이전하지 않습니다. 연결된 지갑이 블록체인 작업을 제어하며 일반적으로 현재 온체인 소유자만 NFT를 판매 등록, 판매 취소 또는 전송할 수 있습니다.'},
{heading:'🌍 지원 언어',body:'JNC 인터페이스는 영어, 일본어, 한국어, 러시아어를 지원합니다. 사용자가 만든 NFT와 샵 콘텐츠는 크리에이터가 입력한 언어 그대로 표시되며 자동 번역되지 않습니다.'}]},
auctionGuide:{title:'경매 가이드',updated:'2026년 7월 25일',sections:[
{heading:'경매 시작',body:'NFT 소유자는 시작 시간, 기간, 시작 가격과 선택 사항인 즉시 구매 가격을 설정합니다. 경매가 진행되는 동안 NFT는 Marketplace 컨트랙트로 이전됩니다.'},
{heading:'입찰 및 즉시 구매',body:'각 입찰에는 지갑 트랜잭션이 필요합니다. 유효한 즉시 구매가 실행되면 경매가 바로 종료됩니다. 종료 직전의 입찰은 자동 연장 규칙에 따라 종료 시간을 연장할 수 있습니다.'},
{heading:'낙찰되지 않은 입찰금',body:'낙찰되지 않은 입찰금은 자동으로 환불되지 않습니다. 경매 종료 후 해당 NFT 카드에 표시되는 “환불 받기” 버튼을 사용하고 지갑 트랜잭션을 승인하세요.'},
{heading:'경매 확정',body:'경매 종료 후 확정을 실행하면 NFT 이전과 대금 분배가 완료됩니다. 확정에는 블록체인 트랜잭션과 가스비가 필요할 수 있습니다.'}]},
faq:{title:'자주 묻는 질문',updated:'2026년 7월 25일',sections:[
{heading:'민트하거나 구매한 NFT는 어디에서 확인하나요?',body:'현재 NFT를 소유한 지갑을 연결한 뒤 My Vault를 여세요. My Vault는 확정된 온체인 소유권을 기준으로 NFT를 표시합니다.'},
{heading:'경매 환불이 지갑에 표시되지 않는 이유는 무엇인가요?',body:'낙찰되지 않은 입찰금은 자동으로 환불되지 않습니다. 경매 종료 후 해당 NFT 카드의 “환불 받기” 버튼을 사용하고 지갑 트랜잭션을 승인하세요.'},
{heading:'가스비란 무엇인가요?',body:'가스비는 블록체인에서 트랜잭션을 처리하기 위해 네트워크에 지불하는 비용입니다. JNC의 마켓플레이스 수수료와는 별도입니다.'},
{heading:'Pending은 무엇을 의미하나요?',body:'지갑 또는 블록체인이 트랜잭션을 처리 중이라는 뜻입니다. 같은 작업을 반복해서 전송하지 말고 먼저 지갑과 트랜잭션 상태를 확인하세요.'},
{heading:'화면과 블록체인 정보가 다른 이유는 무엇인가요?',body:'데이터가 갱신되는 동안 일시적인 지연이 발생할 수 있습니다. 최종 기준은 확정된 온체인 소유권과 컨트랙트 기록입니다.'}]},
terms:{title:'이용약관',updated:'2026년 7월 25일',sections:[
{heading:'1. 서비스',body:'JPYC NFT Center(JNC)는 NFT의 생성, 표시, 판매 등록, 오퍼, 경매, 구매와 전송을 위한 비수탁형 인터페이스를 제공합니다. JNC는 은행, 브로커, 투자자문업자 또는 자산 보관업자가 아닙니다.'},
{heading:'2. 지갑 및 접근',body:'사용자는 호환되는 지갑을 연결해 블록체인 기능을 이용합니다. 지갑, 개인키, 시드 문구, 비밀번호, 기기, 승인과 계정 보안은 사용자 책임입니다. JNC는 개인키나 시드 문구를 요구하거나 수신 또는 저장하지 않습니다.'},
{heading:'3. NFT 및 사용자 콘텐츠',body:'크리에이터는 업로드하거나 민트하는 이미지, 미디어, 메타데이터, 설명, 유틸리티와 기타 콘텐츠에 책임이 있습니다. 사용자는 해당 콘텐츠에 필요한 모든 권리와 허가를 보유해야 합니다. 권리자가 별도로 명시하지 않는 한 NFT를 민트하거나 거래하는 것만으로 저작권 또는 상업적 이용권이 이전되지 않습니다.'},
{heading:'4. 마켓플레이스 거래',body:'판매자는 가격과 경매 조건을 설정합니다. 블록체인 트랜잭션은 확정 후 취소할 수 없을 수 있습니다. 화면의 일시적인 표시와 다를 경우 온체인 소유권, 거래, 판매 등록, 오퍼, 입찰, 구매와 경매 기록이 최종 기준입니다.'},
{heading:'5. 오퍼, 경매 및 즉시 구매',body:'오퍼에는 자금이 Marketplace 컨트랙트에 예치될 수 있습니다. 경매에는 예약 시작, 시작 가격, 즉시 구매 가격, 자동 연장, 환불과 누구나 실행할 수 있는 확정 처리가 포함될 수 있습니다. 지갑에서 승인하기 전에 트랜잭션 내용을 확인하세요.'},
{heading:'6. 수수료',body:'마켓플레이스 수수료와 크리에이터 로열티는 수수료 페이지에 설명되어 있습니다. 네트워크 가스비는 별도이며 JNC가 아닌 블록체인 네트워크에 지불됩니다. 적용 요율은 합리적인 사전 안내 후 변경될 수 있습니다.'},
{heading:'7. 금지 행위',body:'도난 작품, 불법 콘텐츠, 권리 침해 콘텐츠, 허위 또는 오해를 유발하는 메타데이터, 사칭, 사기, 스팸, 악성 코드, 악용 봇, 시세 조작 또는 타인의 권리를 침해하는 콘텐츠를 업로드하거나 거래해서는 안 됩니다.'},
{heading:'8. 이용 제한 및 표시 제거',body:'JNC는 인터페이스 접근을 제한하거나 콘텐츠를 비표시 처리하고 적법한 기관 또는 권리자의 요청에 대응할 수 있습니다. 블록체인 기록과 IPFS 콘텐츠는 JNC 인터페이스와 별개로 남을 수 있습니다.'},
{heading:'9. 무보증 및 책임 제한',body:'서비스는 “있는 그대로” 및 “이용 가능한 범위”에서 제공됩니다. 법이 허용하는 최대 범위에서 JNC는 중단 없는 이용, 오류 없는 스마트 컨트랙트, 자산 가치, 거래 완료 또는 분실한 지갑 접근 권한의 복구를 보장하지 않습니다.'},
{heading:'10. 변경',body:'JNC는 서비스, 지원 네트워크, 법률 또는 기능 변경에 따라 본 약관을 업데이트할 수 있습니다. 업데이트 후 계속 서비스를 이용하면 개정된 약관에 동의한 것으로 간주됩니다.'}]},
privacy:{title:'개인정보처리방침',updated:'2026년 7월 25일',sections:[
{heading:'1. 처리하는 정보',body:'JNC는 마켓플레이스 운영에 필요한 공개 지갑 주소, 컬렉션과 NFT 정보, 메타데이터, 트랜잭션 해시, 컨트랙트 이벤트, 네트워크 정보와 사용자 제공 콘텐츠를 처리할 수 있습니다.'},
{heading:'2. 수집하지 않는 정보',body:'JNC는 개인키, 시드 문구, 지갑 비밀번호, 신용카드 정보 또는 지갑 자금을 요구하거나 저장하지 않습니다. 지갑을 연결하는 것만으로 사용자의 실명이나 비공개 연락처가 자동으로 공개되지 않습니다.'},
{heading:'3. 저장 및 인프라',body:'공개 NFT 미디어와 메타데이터는 Pinata 및 IPFS에 저장될 수 있습니다. 앱 상태는 Vercel 서비스, 브라우저 localStorage와 관련 인프라에 저장될 수 있습니다. 블록체인 트랜잭션은 공개되며 영구적으로 남을 수 있습니다.'},
{heading:'4. 브라우저 데이터',body:'JNC는 초안, 메타데이터 캐시, 표시 설정과 마켓 상태를 유지하기 위해 localStorage와 같은 브라우저 저장 기능을 사용할 수 있습니다. 필수 저장 기능은 서비스 운영을 지원합니다. 분석 또는 비필수 쿠키를 도입할 경우 별도로 공개합니다.'},
{heading:'5. 외부 서비스',body:'JNC는 지갑 제공자, 블록체인 네트워크, RPC 서비스, Pinata, IPFS, Vercel과 관련 호스팅 또는 저장 서비스 등 제3자 인프라를 이용합니다. 각 서비스의 정책이 적용될 수 있습니다.'},
{heading:'6. 공유 및 공개',body:'JNC는 개인정보를 판매하지 않습니다. 법률상 필요한 경우, 사용자 또는 서비스를 보호하는 경우, 악용을 조사하는 경우 또는 필요한 서비스 제공자를 통해 서비스를 운영하는 경우 정보를 공개할 수 있습니다.'},
{heading:'7. 공개 블록체인 안내',body:'지갑 주소와 트랜잭션은 공개 정보입니다. JNC 인터페이스에서 정보를 제거하더라도 블록체인 기록과 IPFS 콘텐츠는 제3자 도구를 통해 계속 접근할 수 있습니다.'},
{heading:'8. 정책 업데이트',body:'JNC가 네트워크, 분석 기능, 결제 옵션 또는 기타 서비스를 추가할 때 본 정책을 업데이트할 수 있습니다.'}]},
fees:{title:'수수료',updated:'2026년 7월 25일',sections:[
{heading:'최초 판매',body:'크리에이터/판매자: 95%\n마켓플레이스 수수료: 5%'},
{heading:'재판매',body:'판매자: 85%\n크리에이터 로열티: 10%\n마켓플레이스 수수료: 5%'},
{heading:'적용 거래 유형',body:'고정가 구매, 수락된 오퍼, 완료된 경매와 경매 즉시 구매에는 해당 판매 분배 규칙이 적용됩니다.'},
{heading:'네트워크 수수료',body:'가스비와 기타 블록체인 비용은 마켓플레이스 수수료와 별도입니다. 이러한 비용은 네트워크와 지갑이 결정하며 트랜잭션이 실패하거나 온체인에서 거부된 경우에도 일반적으로 환불되지 않습니다.'},

copyright:{title:'저작권 정책',updated:'2026년 7월 25일',sections:[

  terms:{
    title:'Условия использования',updated:'17 июля 2026 г.',sections:[
      {heading:'1. Сервис',body:'JPYC NFT Center (JNC) предоставляет некастодиальный интерфейс для создания, отображения, выставления, предложений, аукционов, покупки и перевода NFT. JNC не является банком, брокером, инвестиционным консультантом или кастодианом.'},

      {heading:'3. NFT и пользовательский контент',body:'Создатели отвечают за все изображения, медиафайлы, метаданные, описания, полезность, заявления и другой контент, который они загружают или выпускают. Пользователь должен обладать всеми необходимыми правами и разрешениями. Само по себе создание или обращение NFT не передаёт авторские или коммерческие права, если правообладатель прямо не указал иное.'},
      {heading:'4. Транзакции маркетплейса',body:'Продавцы устанавливают цены и условия аукциона. После подтверждения блокчейн-транзакции могут быть необратимыми. Если временное отображение интерфейса отличается от данных блокчейна, окончательными считаются записи о владении, транзакциях, объявлениях, предложениях, ставках, покупках и аукционах в блокчейне.'},
      {heading:'5. Предложения, аукционы и Buy Now',body:'Предложения могут требовать удержания средств контрактом маркетплейса. Аукционы могут включать запланированное начало, стартовые цены, цены Buy Now, продление против снайпинга, возвраты и финализацию, доступную любому пользователю. Перед подтверждением в кошельке пользователь обязан проверить детали транзакции.'},
      {heading:'6. Комиссии',body:'Комиссии маркетплейса и роялти создателя описаны в разделе «Комиссии». Сетевые gas-комиссии оплачиваются отдельно сети блокчейна, а не JNC. Применяемые ставки могут быть изменены после разумного уведомления.'},
      {heading:'7. Запрещённые действия',body:'Запрещается загружать или продавать украденные произведения, незаконный или нарушающий права контент, мошеннические или вводящие в заблуждение метаданные, материалы с выдачей себя за другое лицо, мошенничество, спам, вредоносный код, злоупотребляющих ботов, манипулирование рынком или контент, нарушающий права других лиц.'},
      {heading:'8. Ограничение и удаление',body:'JNC может ограничивать доступ к интерфейсу, скрывать контент в интерфейсе или отвечать на действительные запросы государственных органов и правообладателей. Записи блокчейна и контент IPFS могут оставаться доступными независимо от интерфейса JNC.'},
      {heading:'9. Отсутствие гарантий и ограничение ответственности',body:'Сервис предоставляется «как есть» и «по мере доступности». В максимально разрешённой законом степени JNC не гарантирует бесперебойную работу, отсутствие ошибок в смарт-контрактах, стоимость активов, завершение транзакций или восстановление утраченного доступа к кошельку.'},

  privacy:{
    title:'Политика конфиденциальности',updated:'17 июля 2026 г.',sections:[
      {heading:'1. Обрабатываемая информация',body:'JNC может обрабатывать публичные адреса кошельков, сведения о коллекциях и NFT, метаданные, хэши транзакций, события контрактов, сведения о сети и пользовательский контент, необходимый для работы интерфейса маркетплейса.'},
      {heading:'2. Информация, которую JNC не собирает',body:'JNC не запрашивает и не хранит закрытые ключи, seed-фразы, пароли кошельков, данные банковских карт или средства кошельков. Подключение кошелька само по себе не раскрывает юридическое имя пользователя или закрытые контактные данные.'},
      {heading:'3. Хранение и инфраструктура',body:'Публичные медиафайлы и метаданные NFT могут храниться через Pinata и IPFS. Состояние приложения может храниться через сервисы Vercel, localStorage браузера и связанную инфраструктуру. Блокчейн-транзакции хранятся публично и могут быть постоянными.'},
      {heading:'4. Данные браузера',body:'JNC может использовать localStorage и аналогичные средства хранения браузера для сохранения черновиков, кэша метаданных, настроек отображения и состояния маркетплейса. Необходимое хранилище поддерживает работу сервиса. Аналитические или необязательные cookies будут раскрыты при их внедрении.'},
      {heading:'5. Поставщики услуг',body:'JNC использует стороннюю инфраструктуру, включая провайдеров кошельков, сети блокчейна, RPC-сервисы, Pinata, IPFS, Vercel и связанных поставщиков хостинга или хранения. Могут применяться их собственные политики.'},
      {heading:'6. Передача и раскрытие',body:'JNC не продаёт персональную информацию. Информация может быть раскрыта, если это требуется законом, необходимо для защиты пользователей или сервиса, расследования злоупотреблений либо работы сервиса через необходимых поставщиков.'},
      {heading:'7. Уведомление о публичном блокчейне',body:'Адреса кошельков и транзакции являются публичными. Даже после удаления информации из интерфейса JNC записи блокчейна и контент IPFS могут оставаться доступными через сторонние инструменты.'},
      {heading:'8. Обновление политики',body:'Эта политика может обновляться по мере добавления JNC новых сетей, аналитики, способов оплаты или других сервисов.'}
    ]
  },

      {heading:'Первичная продажа',body:'Создатель / продавец: 95%\nКомиссия маркетплейса: 5%'},
      {heading:'Перепродажа',body:'Продавец: 85%\nРоялти создателя: 10%\nКомиссия маркетплейса: 5%'},
      {heading:'Применимые типы транзакций',body:'Соответствующее распределение применяется к покупке по фиксированной цене, принятому предложению, завершённому аукциону и покупке Buy Now на аукционе.'},
      {heading:'Сетевые комиссии',body:'Gas-комиссии и другие сборы блокчейна не входят в комиссии маркетплейса. Они определяются сетью и кошельком и обычно не возвращаются, в том числе если транзакция не выполнена или отклонена в блокчейне.'},
      {heading:'Будущие изменения',body:'Правила комиссий и роялти могут обновляться по мере развития сервиса. Текущий раздел «Комиссии» является публичным источником для интерфейса, а фактическое распределение каждой транзакции в блокчейне определяется развёрнутым смарт-контрактом.'}

  copyright:{
    title:'Политика авторских прав',updated:'17 июля 2026 г.',sections:[
      {heading:'1. Права создателя',body:'Создатели сохраняют авторские и другие права интеллектуальной собственности, если эти права не были действительным образом переданы или лицензированы. Mint NFT записывает токен, но не доказывает автоматически авторство и не передаёт авторские права.'},
      {heading:'2. Права покупателя',body:'Покупка NFT передаёт только владение токеном. Авторские права, права коммерческого использования, воспроизведения и создания производных произведений остаются у правообладателя, если отдельные условия лицензии прямо не предусматривают иное.'},
      {heading:'3. Ответственность пользователя',body:'Запрещается выпускать, выставлять, продавать или показывать контент без разрешения на его использование. Метаданные не должны содержать ложные заявления об авторстве, принадлежности, лицензировании или подлинности.'},
      {heading:'4. Сообщения о нарушении',body:'Правообладатель может сообщить о предполагаемом нарушении, указав защищаемое произведение, соответствующий NFT или коллекцию, контактные данные, добросовестное заявление и подтверждение полномочий. На время проверки JNC может скрыть указанный контент в интерфейсе.'},
      {heading:'5. Ограничения блокчейна и IPFS',body:'JNC может ограничить или удалить контент из собственного интерфейса, но может быть не в состоянии удалить токены, историю блокчейна или файлы, хранящиеся в децентрализованных системах.'},
      {heading:'6. DMCA и аналогичные процедуры',body:'JNC намерен поддерживать процедуру сообщений о правах в соответствии с применимым законодательством об авторских правах, включая при необходимости процедуры уведомления и встречного уведомления по модели DMCA.'}
    ]

  disclaimer:{
    title:'Отказ от ответственности',updated:'25 июля 2026 г.',sections:[
      {heading:'Доступность сервиса',body:'Функции JNC, поддерживаемые кошельки, контракты, источники данных и доступность могут изменяться по мере развития сервиса. Перед каждой транзакцией пользователь должен проверить текущий интерфейс, сведения о контрактах, комиссии и запросы кошелька.'},
      {heading:'Не является инвестиционной рекомендацией',body:'Ничто в JNC не является финансовой, инвестиционной, юридической, налоговой или бухгалтерской консультацией. Цены NFT носят спекулятивный характер и могут упасть до нуля. Пользователь принимает решения самостоятельно и при необходимости обращается за профессиональной консультацией.'},
      {heading:'Риски кошелька',body:'JNC не может восстановить закрытые ключи, seed-фразы, пароли, потерянные устройства или скомпрометированные кошельки. Разрешения кошелька и подтверждения транзакций контролируются пользователем и провайдером кошелька.'},
      {heading:'Риски блокчейна и смарт-контрактов',body:'Транзакции могут завершаться ошибкой, задерживаться, подвергаться реорганизации или становиться дорогими. Смарт-контракты могут содержать дефекты или работать неожиданным образом. Перегрузка сети, сбои RPC, форки или проблемы сторонних сервисов могут повлиять на доступ и транзакции.'},
      {heading:'Gas и возвраты',body:'Gas-комиссии уплачиваются сети и обычно не возвращаются. Возврат ставок и другие средства, удерживаемые контрактом, требуют от пользователя выполнить доступную процедуру вывода в блокчейне.'},
      {heading:'Сторонний контент и сервисы',body:'JNC не гарантирует точность, законность, подлинность, доступность или стоимость пользовательских NFT либо сторонних сервисов, ссылок, кошельков, шлюзов, хостинг-провайдеров и инфраструктуры блокчейна.'},
      {heading:'Ответственность пользователя',body:'Пользователь обязан проверять контент NFT, владение, лицензии, цены, комиссии, детали транзакций, адреса контрактов, выбранную сеть и запросы кошелька до совершения действий.'}

async function assertTransactionPreflight(tx){

  const allowedTargets=[];
  Object.values(JNC_DEPLOYMENT_REGISTRY).filter(item=>item.enabled).forEach(deployment=>allowedTargets.push(deployment.contracts.nft,deployment.contracts.marketplace));
  getAdminPaymentTokenRegistry().forEach(profile=>allowedTargets.push(profile?.paymentToken?.address));

async function getReceipt(txHash,chainOrKey=null){

  let walletError=null;
  if(window.ethereum){
    try{
      const targetChain=trackedChain?chainConfigFrom(trackedChain):null;
      const active=await getActiveChainId();
      if(!targetChain||isConfiguredChain(active,targetChain)){
        const receipt=await ethereum.request({method:'eth_getTransactionReceipt',params:[hash]});
        if(receipt)return receipt;
      }
    }catch(error){walletError=error;}
  }
  if(trackedChain){
    try{
      const receipt=await publicRpcRequest(trackedChain,'eth_getTransactionReceipt',[hash]);
      if(receipt)return receipt;
    }catch(error){
      if(!walletError)walletError=error;
    }
  }

}
async function waitForReceipt(txHash,attempts=45,delayMs=4000,chainOrKey=null){

  for(let i=0;i<attempts;i++){
    const receipt=await getReceipt(hash,trackedChain);
    if(receipt){JNC_PENDING_TX_CHAINS.delete(hash.toLowerCase());return receipt;}
    if(i<attempts-1)await sleep(delayMs);
  }

/* =========================================================
   JNC v2.5.14 — ERC20 DECIMALS LIST REPAIR
   ---------------------------------------------------------
   Payment Profile decimals are useful metadata, but settlement units must
   follow the ERC20 contract on the active chain. Runtime reads therefore
   cache decimals() by Chain × Token and all amount conversions prefer that
   on-chain value. This prevents stale/missing Admin snapshots from turning
   e.g. 10,000 PICH (9 decimals) into a trillion-unit display/value.

const JNC_PAYMENT_TOKEN_DECIMALS_CACHE=new Map();
function paymentTokenDecimalsCacheKey(nftOrProfile=null){
  const route=resolveMarketplacePaymentRoute(nftOrProfile);
  return `${route.chain.id}:${lc(route.tokenAddress)}`;
}
function paymentTokenDecimals(nftOrProfile=null){
  if(nftOrProfile){
    try{
      const cached=JNC_PAYMENT_TOKEN_DECIMALS_CACHE.get(paymentTokenDecimalsCacheKey(nftOrProfile));
      if(Number.isInteger(cached)&&cached>=0&&cached<=255)return cached;
    }catch(_){ }
  }
  const profile=nftOrProfile?getMarketplacePaymentProfile(nftOrProfile):null;
  const raw=profile?.paymentToken?.decimals;
  const decimals=(raw===null||raw===undefined||raw==='')?NaN:Number(raw);
  return Number.isInteger(decimals)&&decimals>=0&&decimals<=255?decimals:18;
}
async function ensurePaymentTokenDecimals(nftOrProfile,{switchChain=false}={}){
  const route=resolveMarketplacePaymentRoute(nftOrProfile);
  const key=`${route.chain.id}:${lc(route.tokenAddress)}`;
  const cached=JNC_PAYMENT_TOKEN_DECIMALS_CACHE.get(key);
  if(Number.isInteger(cached)&&cached>=0&&cached<=255)return cached;
  if(switchChain)await switchToConfiguredChain(route.chain);
  const raw=await ethCall(route.tokenAddress,sig4('decimals()'),route.chain.id);
  const decimals=Number(BigInt(raw));
  if(!Number.isInteger(decimals)||decimals<0||decimals>255)throw new Error(`Invalid ERC20 decimals for ${route.symbol}.`);
  JNC_PAYMENT_TOKEN_DECIMALS_CACHE.set(key,decimals);

function tokenAmountToBaseUnits(value,nftOrProfile=null){

  if(fraction.length>decimals&&/[^0]/.test(fraction.slice(decimals)))throw new Error(`Too many decimal places for ${currencyUnit(nftOrProfile)}. Maximum is ${decimals}.`);

function baseUnitsToTokenAmount(amount,nftOrProfile=null,maxFraction=6){

  for(const log of logs){
    const topics=Array.isArray(log?.topics)?log.topics:[];
    if(lc(log?.address)!==lc(nftContract))continue;
    if(lc(topics[0])!==transferTopic||lc(topics[1])!==zeroTopic)continue;
    if(recipientTopic&&topics[2]&&lc(topics[2])!==lc(recipientTopic))continue;
    if(!topics[3])continue;
    try{return BigInt(topics[3]).toString();}catch(e){console.warn('Mint Transfer tokenId decode failed:',e,log);}
  }
  return'';

  if(PNC_WALLET_CONNECTING)return;
  PNC_WALLET_CONNECTING=true;
  try{
    const previousWallet=PNC_STATE.wallet;
    const selected=await requestSelectedMetaMaskAccount();
    if(!selected)throw new Error(t('walletTx.noAccountSelected'));
    await switchToConfiguredChain();
    const accounts=await ethereum.request({method:'eth_accounts'});
    const confirmed=accounts&&accounts[0]?accounts[0]:selected;
    if(previousWallet&&lc(previousWallet)!==lc(confirmed))clearCreatorWork(previousWallet);
    setManualWalletLogout(false);
    applyWalletIdentity(confirmed);
    prepareCreatorWorkRecovery(confirmed);
    renderAll(PNC_STATE);
    restoreCreatorWorkUIStable(confirmed);
    closeWalletModal();
    await refreshPlatform();
    restoreCreatorWorkUIStable(confirmed);
  }catch(e){
    if(isMetaMaskPendingError(e))alert(t('walletTx.metamaskPending'));
    else if(!isMetaMaskUserRejected(e))alert(t('walletTx.connectFailed')+'\n'+(e.message||e));
    console.warn(e);
  }finally{PNC_WALLET_CONNECTING=false;}
}
async function disconnectWallet(){
  const wallet=PNC_STATE.wallet;
  setManualWalletLogout(true);
  clearCreatorWork(wallet);
  JNC_PENDING_RECOVERY_PAGE='';
  PNC_CREATOR_TAB='dashboard';

  if(window.ethereum){
    try{
      await ethereum.request({
        method:'wallet_revokePermissions',
        params:[{eth_accounts:{}}]
      });
    }catch(error){
      const code=Number(error?.code);
      const unsupported=code===-32601||code===4200;
      const rejected=code===4001;
      if(!unsupported&&!rejected){
        console.warn('MetaMask permission revoke failed:',error);
      }
    }
  }

  applyWalletIdentity(null);
  renderAll(PNC_STATE);
  closeWalletModal();
  await refreshPlatform();
}
function scheduleWalletStateRefresh(){
  captureActiveCreatorWork();
  clearTimeout(PNC_WALLET_EVENT_TIMER);
  PNC_WALLET_EVENT_TIMER=setTimeout(async()=>{
    try{
      const chain=await getActiveChainId();
      const accounts=await ethereum.request({method:'eth_accounts'});
      const next=accounts&&accounts[0]?accounts[0]:null;
      if(isManualWalletLogout()){
        if(!next)return;
        return;
      }
      const previous=PNC_STATE.wallet;
      if(previous&&next&&lc(previous)!==lc(next))clearCreatorWork(previous);
      applyWalletIdentity(next);
      if(next)prepareCreatorWorkRecovery(next);
      renderAll(PNC_STATE);
      restoreCreatorWorkUIStable(next);
      if(isLiveDeploymentChain(chain))await refreshPlatform();
      restoreCreatorWorkUIStable(next);
    }catch(e){console.warn('Wallet state refresh failed:',e);}
  },180);
}
async function recoverAuthorizedWallet(options={}){
  if(!window.ethereum||PNC_WALLET_CONNECTING||PNC_WALLET_RECOVERING||isManualWalletLogout())return false;
  captureActiveCreatorWork();
  PNC_WALLET_RECOVERING=true;
  try{
    const accounts=await ethereum.request({method:'eth_accounts'});
    const authorized=accounts&&accounts[0]?accounts[0]:null;
    if(!authorized)return false;
    const previous=PNC_STATE.wallet;
    const changed=lc(previous)!==lc(authorized);
    if(previous&&changed)clearCreatorWork(previous);
    prepareCreatorWorkRecovery(authorized);
    if(changed){
      applyWalletIdentity(authorized);
      if(options.render!==false)renderAll(PNC_STATE);
      if(options.refreshOnChange!==false){
        const chain=await getActiveChainId();
        if(isLiveDeploymentChain(chain))await refreshPlatform();
      }
    }
    restoreCreatorWorkUIStable(authorized);
    return true;
  }catch(e){
    console.warn('Authorized wallet recovery skipped:',e);
    return false;
  }finally{PNC_WALLET_RECOVERING=false;}
}
function scheduleAuthorizedWalletRecovery(){
  if(isManualWalletLogout())return;
  captureActiveCreatorWork();
  clearTimeout(PNC_WALLET_RECOVERY_TIMER);
  PNC_WALLET_RECOVERY_TIMER=setTimeout(()=>recoverAuthorizedWallet({render:true,refreshOnChange:true}),220);
}
function handleVisibleWalletRecovery(){
  if(document.visibilityState==='visible')scheduleAuthorizedWalletRecovery();
}
function installWalletListeners(){
  if(!window.ethereum||window.__PNC_WALLET_LISTENERS__)return;
  window.__PNC_WALLET_LISTENERS__=true;
  ethereum.on?.('accountsChanged',scheduleWalletStateRefresh);
  ethereum.on?.('chainChanged',scheduleWalletStateRefresh);
  window.addEventListener('pageshow',scheduleAuthorizedWalletRecovery);
  window.addEventListener('focus',scheduleAuthorizedWalletRecovery);
  document.addEventListener('visibilitychange',handleVisibleWalletRecovery);

function setRefreshButtonState(mode){
  const btn=$('platformRefreshBtn');
  if(!btn)return;
  btn.classList.toggle('is-refreshing',mode==='loading');
  btn.classList.toggle('is-ok',mode==='ok');
  btn.classList.toggle('is-error',mode==='error');

async function refreshPlatform(options={}){
  if(PNC_REFRESHING){
    PNC_REFRESH_QUEUED=true;
    return PNC_REFRESH_PROMISE||Promise.resolve(PNC_STATE);
  }
  PNC_REFRESHING=true;
  PNC_REFRESH_QUEUED=false;
  setRefreshButtonState('loading');
  PNC_REFRESH_PROMISE=(async()=>{
    try{
      let result=null;
      do{
        PNC_REFRESH_QUEUED=false;
        const refreshResults=await Promise.all([loadAdminPaymentTokenRegistry(),loadBlockchainState()]);
        result=refreshResults[1];
      }while(PNC_REFRESH_QUEUED);
      setRefreshButtonState('ok');
      if(options.feedback)console.info('JNC platform updated.');
      setTimeout(()=>setRefreshButtonState('idle'),900);
      return result||PNC_STATE;
    }catch(e){
      setRefreshButtonState('error');
      setTimeout(()=>setRefreshButtonState('idle'),1800);
      console.warn('Platform refresh failed:',e);
      if(options.feedback)alert(t('marketTx.updateFailed'));
      throw e;
    }finally{
      PNC_REFRESHING=false;
      PNC_REFRESH_PROMISE=null;
    }
  })();
  return PNC_REFRESH_PROMISE;
}
